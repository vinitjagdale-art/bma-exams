<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright Minds Academy - 10th English Grammar</title>
    <style>
        /* Distinct Green Theme for English Grammar */
        :root { 
            --primary-bg: #173627; 
            --text-color: #ffffff; 
            --accent-color: #2bb872; 
            --error: #ff5252; 
            --correct: #81c784; 
            --answered: #ff9800; 
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--primary-bg); color: var(--text-color); margin: 0; padding: 10px; display: flex; justify-content: center; }
        #exam-container { width: 100%; max-width: 850px; background: rgba(255, 255, 255, 0.1); padding: 1.5rem; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .page { display: none; }
        .active { display: block; }
       #nav-grid { 
    display: grid; 
    grid-template-columns: repeat(10, 35px); /* Locks width to make perfect circles */
    justify-content: center; /* Centers the circles in the box */
    gap: 12px; /* Slightly wider gap so glowing borders don't overlap */
    margin-top: 20px; 
    background: rgba(0,0,0,0.2); 
    padding: 15px; 
    border-radius: 8px; 
}
.nav-box { 
    width: 35px; /* Explicit width added */
    height: 35px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    border-radius: 50%; /* This makes the box a perfect circle */
    background: rgba(255, 255, 255, 0.05); /* Dimmed default state */
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    cursor: pointer; 
    font-weight: bold; 
    font-size: 0.9rem; 
    transition: all 0.3s ease; /* Smooth fade when glowing */
}
/* Neon Green Glow for Current Question */
.nav-box.current { 
    background: var(--accent-color); 
    border: 2px solid #fff; 
    box-shadow: 0 0 10px var(--accent-color), 0 0 20px var(--accent-color); 
    color: var(--primary-bg); /* Dark text to stand out against bright green */
}
/* Neon Orange/Amber Glow for Answered Questions */
.nav-box.answered { 
    background: var(--answered); 
    border: 2px solid #fff;
    box-shadow: 0 0 8px var(--answered), 0 0 15px var(--answered); 
    color: #fff;
}
        .info-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; font-size: 0.9rem; }
        .header-main { text-align: center; border-bottom: 2px solid var(--accent-color); margin-bottom: 15px; padding-bottom: 10px; }
        #question-scroll-area { max-height: 60vh; overflow-y: auto; padding-right: 10px; margin-top: 10px; }
        .option-label { display: block; background: rgba(255,255,255,0.05); margin: 10px 0; padding: 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .option-label:hover { background: rgba(255,255,255,0.12); }
        input[type="radio"] { margin-right: 12px; transform: scale(1.2); }
        .btn-container { margin-top: 20px; display: flex; justify-content: space-between; }
        button { padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; background: var(--accent-color); color: white; font-weight: bold; }
        .review-card { background: rgba(0,0,0,0.3); padding: 15px; margin: 15px 0; border-radius: 8px; border-left: 5px solid var(--error); }
        .review-card.status-correct { border-left-color: var(--correct); }
    </style>
</head>
<body>

<div id="exam-container">
    <div id="page-landing" class="page active">
        <h1 class="header-main">Bright Minds Academy</h1>
        <div class="info-box" style="display: block;">
            <p><strong>Subject:</strong> English</p>
            <p id="exam-title-display"><strong>Topic:</strong> Loading...</p>
            <p><strong>Standard:</strong> 10th | <strong>Marks:</strong> 30 | <strong>Time:</strong> 30 Mins</p>
        </div>
        <div style="margin: 30px 0; text-align: center;">
            <input type="text" id="student-name" placeholder="Enter Full Student Name" style="width: 80%; padding: 12px; border-radius: 6px; border: none;">
        </div>
        <div style="text-align: center;"><button onclick="startExam()">Start Assignment</button></div>
    </div>

    <div id="page-exam" class="page">
        <div class="header-main" style="font-size: 1.2rem;">Bright Minds Academy</div>
        <div class="info-box">
            <span><strong>Time Left:</strong> <span id="timer-display">30:00</span></span>
            <span><strong>Marks:</strong> 30</span>
            <span><strong>Questions:</strong> 30</span>
        </div>
        <div id="question-scroll-area">
            <h3 id="q-title"></h3>
            <p id="q-text" style="font-size: 1.1rem; line-height: 1.6;"></p>
            <div id="options-container"></div>
        </div>
        <div class="btn-container">
            <button id="prev-btn" onclick="changeQuestion(-1)">Back</button>
            <button id="next-btn" onclick="changeQuestion(1)">Next</button>
        </div>
        <div id="nav-grid"></div>
    </div>

    <div id="page-result" class="page">
        <h2 id="res-name" style="text-align: center;"></h2>
        <h1 style="text-align: center;">Score: <span id="final-score"></span></h1>
        <div id="ai-analysis" style="background: rgba(76, 175, 80, 0.15); padding: 20px; border-radius: 10px; margin: 20px 0; line-height: 1.5;"></div>
        <h3>Question Review</h3>
        <div id="review-list"></div>
    </div>
</div>

<script>
    // UPDATE THESE FOR EACH NEW EXAM
    const EXAM_KEY = "10th_Eng_Grammar_non-finite-verbs3"; 
    const EXAM_NAME = "Non-Finite Verbs Test 3"; 
    
    // CONSTANTS
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwEutZaKIAodDqKVocXPmgGlsfyO6ma8vuQK4sFgEobmvD73QQwztuH4qbT_R3g1Figtw/exec";
    const HARDCODED_STD = "10th";
    const HARDCODED_SUBJECT = "English";
    
    let timerInterval;
    let timeRemaining = 1800; // 30 Minutes

    // JSON PAYLOAD GOES HERE (Paste the clean JSON array below this line)
    const questions =[
  {
    "q": "Pick out the infinitive from the sentence: She loves to sing.",
    "options": [
      "She",
      "loves",
      "to sing",
      "to"
    ],
    "ans": 2,
    "topic": "Infinitive",
    "explain": "'to sing' is the infinitive, formed by TO + the base verb 'sing'. It acts as a noun (the object of 'loves')."
  },
  {
    "q": "Identify the infinitive in the given sentence: He decided to leave.",
    "options": [
      "decided",
      "to leave",
      "He",
      "leave"
    ],
    "ans": 1,
    "topic": "Infinitive",
    "explain": "'to leave' is the non-finite infinitive verb serving as the object of the finite verb 'decided'."
  },
  {
    "q": "Pick out the infinitive from the sentence: The bird tried to fly.",
    "options": [
      "bird",
      "tried",
      "to",
      "to fly"
    ],
    "ans": 3,
    "topic": "Infinitive",
    "explain": "'to fly' is the infinitive. It does not change with the subject or tense."
  },
  {
    "q": "Pick out the infinitive from the sentence: Every student wants to learn.",
    "options": [
      "Every",
      "wants",
      "to learn",
      "student"
    ],
    "ans": 2,
    "topic": "Infinitive",
    "explain": "The infinitive is 'to learn' (TO + verb word). 'wants' is the finite verb."
  },
  {
    "q": "Pick out the infinitive from the following sentence: The girl began to dance.",
    "options": [
      "to dance",
      "began",
      "girl",
      "The"
    ],
    "ans": 0,
    "topic": "Infinitive",
    "explain": "'to dance' acts as a noun representing the action, making it the infinitive."
  },
  {
    "q": "In which of the following sentences is 'to' part of an infinitive, rather than a preposition?",
    "options": [
      "She went to school.",
      "Give the book to him.",
      "She wants to study.",
      "They traveled to Mumbai."
    ],
    "ans": 2,
    "topic": "Infinitive",
    "explain": "In 'She wants to study', 'to' is followed by a base verb. In the others, 'to' is followed by a noun or pronoun, acting as a preposition."
  },
  {
    "q": "Pick out the gerund from the sentence: Reading is a good habit.",
    "options": [
      "is",
      "good",
      "habit",
      "Reading"
    ],
    "ans": 3,
    "topic": "Gerund",
    "explain": "'Reading' functions as the subject of the sentence, making it a gerund (noun)."
  },
  {
    "q": "Identify the gerund in the given sentence: She enjoys cooking.",
    "options": [
      "She",
      "enjoys",
      "cooking",
      "is"
    ],
    "ans": 2,
    "topic": "Gerund",
    "explain": "'cooking' acts as a noun and is the object of the verb 'enjoys', so it is a gerund."
  },
  {
    "q": "Pick out the gerund from the sentence: He is fond of playing cricket.",
    "options": [
      "fond",
      "playing",
      "of",
      "cricket"
    ],
    "ans": 1,
    "topic": "Gerund",
    "explain": "'playing' acts as the object of the preposition 'of', functioning as a noun (gerund)."
  },
  {
    "q": "Identify the gerund from the sentence: She loves singing songs.",
    "options": [
      "She",
      "loves",
      "singing",
      "songs"
    ],
    "ans": 2,
    "topic": "Gerund",
    "explain": "'singing' is an -ING verb form acting as a noun, taking the position of the object."
  },
  {
    "q": "Pick out the gerund from the sentence: Running is good for health.",
    "options": [
      "Running",
      "is",
      "good",
      "health"
    ],
    "ans": 0,
    "topic": "Gerund",
    "explain": "'Running' is the subject of the sentence, which means this -ING word is acting as a noun (gerund)."
  },
  {
    "q": "In the sentence 'She was swimming in the pool', what role does 'swimming' play?",
    "options": [
      "It is a gerund acting as the subject.",
      "It is a past participle.",
      "It is an infinitive.",
      "It is a present participle acting as part of the continuous verb."
    ],
    "ans": 3,
    "topic": "Gerund vs Participle",
    "explain": "Because 'swimming' is part of the action verb phrase 'was swimming', it is a present participle, not a gerund."
  },
  {
    "q": "Pick out the past participle from the sentence: The broken glass is on the floor.",
    "options": [
      "glass",
      "broken",
      "is",
      "floor"
    ],
    "ans": 1,
    "topic": "Participle",
    "explain": "'broken' ends in -EN and acts as an adjective describing the 'glass', making it a past participle."
  },
  {
    "q": "Identify the present participle in the sentence: She saw the running horse.",
    "options": [
      "She",
      "saw",
      "running",
      "horse"
    ],
    "ans": 2,
    "topic": "Participle",
    "explain": "'running' is a verb+ING form used as an adjective modifying 'horse', so it is a present participle."
  },
  {
    "q": "Pick out the participle and state its type: She wore a stitched dress.",
    "options": [
      "wore - Past Participle",
      "stitched - Present Participle",
      "dress - Present Participle",
      "stitched - Past Participle"
    ],
    "ans": 3,
    "topic": "Participle",
    "explain": "'stitched' ends in -ED and modifies the noun 'dress', making it a Past Participle."
  },
  {
    "q": "Identify the present participle from the following sentence: The sleeping dog didn't wake up.",
    "options": [
      "sleeping",
      "dog",
      "didn't",
      "wake"
    ],
    "ans": 0,
    "topic": "Participle",
    "explain": "'sleeping' describes the dog, functioning as an adjective (present participle)."
  },
  {
    "q": "Form a present participle in which the last letter is doubled for the base verb 'fit'.",
    "options": [
      "fiting",
      "fitting",
      "fitted",
      "fitingg"
    ],
    "ans": 1,
    "topic": "Doubling Rule",
    "explain": "'fit' has a short vowel followed by a single consonant, so the 't' is doubled to make 'fitting'."
  },
  {
    "q": "Form a present participle in which the last letter is doubled for the base verb 'hit'.",
    "options": [
      "hitting",
      "hiting",
      "hitted",
      "hititing"
    ],
    "ans": 0,
    "topic": "Doubling Rule",
    "explain": "The single short vowel followed by a single consonant means we double the 't' before adding -ING."
  },
  {
    "q": "Form a present participle in which the last letter is doubled for the base verb 'get'.",
    "options": [
      "geting",
      "gotten",
      "getting",
      "gate"
    ],
    "ans": 2,
    "topic": "Doubling Rule",
    "explain": "'get' meets the rule criteria (single vowel + single consonant), resulting in 'getting'."
  },
  {
    "q": "Form a past participle in which the last letter is doubled for the base verb 'pin'.",
    "options": [
      "pining",
      "pinning",
      "pined",
      "pinned"
    ],
    "ans": 3,
    "topic": "Doubling Rule",
    "explain": "The 'n' is doubled before adding the past participle suffix -ED, making it 'pinned'."
  },
  {
    "q": "Which of the following verbs does NOT double its final consonant before adding -ING?",
    "options": [
      "sit",
      "get",
      "read",
      "cut"
    ],
    "ans": 2,
    "topic": "Doubling Rule",
    "explain": "'read' has two vowels (ea) before the final consonant, so it does not double the 'd' (reading)."
  },
  {
    "q": "Form a present participle in which the last letter is doubled for the base verb 'sit'.",
    "options": [
      "siteing",
      "siting",
      "sitting",
      "sited"
    ],
    "ans": 2,
    "topic": "Doubling Rule",
    "explain": "'sit' has a short vowel + single consonant, so we double the 't' to form 'sitting'."
  },
  {
    "q": "Why is the letter 'k' NOT doubled when forming the present participle of 'walk' (walking)?",
    "options": [
      "It has a short vowel.",
      "It is an exception to the rule.",
      "It ends in a consonant cluster (lk).",
      "It is a gerund."
    ],
    "ans": 2,
    "topic": "Doubling Rule",
    "explain": "The doubling rule requires a single final consonant. 'walk' ends in two consonants (l and k)."
  },
  {
    "q": "Identify the FINITE verb in the sentence: They began to sing.",
    "options": [
      "They",
      "began",
      "to",
      "sing"
    ],
    "ans": 1,
    "topic": "Finite vs Non-Finite",
    "explain": "'began' is finite because it shows tense (past) and acts as the main verb connected to the subject."
  },
  {
    "q": "Identify the NON-FINITE verb in the sentence: The boy was running fast.",
    "options": [
      "boy",
      "was",
      "running",
      "fast"
    ],
    "ans": 2,
    "topic": "Finite vs Non-Finite",
    "explain": "'running' is a present participle (non-finite). The helping verb 'was' is the finite verb that shows tense and agrees with the subject."
  },
  {
    "q": "In the sentence 'She wants to eat', which verb will change if we change the subject to 'They'?",
    "options": [
      "She",
      "to",
      "eat",
      "wants"
    ],
    "ans": 3,
    "topic": "Finite vs Non-Finite",
    "explain": "'wants' is the finite verb, so it will change to 'want'. 'to eat' is non-finite and stays exactly the same."
  },
  {
    "q": "According to the Golden Test, what defines a Finite Verb?",
    "options": [
      "It is always a noun.",
      "It changes when the subject or tense changes.",
      "It never changes regardless of the subject.",
      "It always ends in -ING."
    ],
    "ans": 1,
    "topic": "Finite vs Non-Finite",
    "explain": "If a verb changes according to the subject (singular/plural) or tense, it is a FINITE verb."
  },
  {
    "q": "What is the correct formula to form a Gerund?",
    "options": [
      "TO + Base Verb",
      "Verb + D/ED/EN",
      "Having + Past Participle",
      "Verb + ING (acting as a noun)"
    ],
    "ans": 3,
    "topic": "Gerund",
    "explain": "A gerund is formed by adding -ING to a verb, and it functions specifically as a noun (subject or object)."
  },
  {
    "q": "Rewrite the sentence using an infinitive: She started dancing.",
    "options": [
      "She started dance.",
      "She starts to dancing.",
      "She started to dance.",
      "She starting to dance."
    ],
    "ans": 2,
    "topic": "Infinitive",
    "explain": "The gerund 'dancing' is replaced by the infinitive form 'to dance', maintaining the original past tense of the main verb 'started'."
  },
  {
    "q": "Identify both the finite and non-finite verbs in the sentence: He hopes to win.",
    "options": [
      "Finite: to win | Non-Finite: hopes",
      "Finite: hopes | Non-Finite: to win",
      "Finite: He | Non-Finite: hopes",
      "Finite: win | Non-Finite: to"
    ],
    "ans": 1,
    "topic": "Finite vs Non-Finite",
    "explain": "'hopes' is the finite verb because it changes with the subject (They hope). 'to win' is the non-finite infinitive."
  }
];

    let currentQ = 0;
    let userAnswers = new Array(30).fill(null);
    let studentName = "";

    function startTimer() {
        timerInterval = setInterval(() => {
            timeRemaining--;
            sessionStorage.setItem('time_remaining', timeRemaining);
            updateTimerDisplay();
            if (timeRemaining <= 0) { 
                clearInterval(timerInterval); 
                submitExam(true); // Pass true because it's a forced auto-submit
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        document.getElementById('timer-display').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function startExam() {
        studentName = document.getElementById('student-name').value.trim();
        if (!studentName) return alert("Please enter your name");
        sessionStorage.setItem('name', studentName);
        sessionStorage.setItem('in_progress_' + EXAM_KEY, "true");
        document.getElementById('page-landing').classList.remove('active');
        document.getElementById('page-exam').classList.add('active');
        document.getElementById('exam-title-display').innerHTML = `<strong>Topic:</strong> ${EXAM_NAME}`;
        startTimer();
        renderGrid();
        showQuestion();
    }

    function renderGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = "";
        questions.forEach((_, i) => {
            const div = document.createElement('div');
            div.className = `nav-box ${i === currentQ ? 'current' : ''} ${userAnswers[i] !== null ? 'answered' : ''}`;
            div.innerText = i + 1;
            div.onclick = () => jumpTo(i);
            grid.appendChild(div);
        });
    }

    function showQuestion() {
        const q = questions[currentQ];
        document.getElementById('q-title').innerText = `Question ${currentQ + 1}`;
        document.getElementById('q-text').innerHTML = q.q;
        const optCont = document.getElementById('options-container');
        optCont.innerHTML = "";
        q.options.forEach((opt, idx) => {
            const lbl = document.createElement('label');
            lbl.className = "option-label";
            lbl.innerHTML = `<input type="radio" name="opt" ${userAnswers[currentQ] === idx ? 'checked' : ''} onchange="saveAns(${idx})"> ${opt}`;
            optCont.appendChild(lbl);
        });
        document.getElementById('next-btn').innerText = currentQ === questions.length - 1 ? "Finish" : "Next";
        sessionStorage.setItem('currentQ', currentQ);
        renderGrid();
    }

    function saveAns(idx) {
        userAnswers[currentQ] = idx;
        sessionStorage.setItem('answers', JSON.stringify(userAnswers));
        renderGrid();
    }

    function jumpTo(i) { currentQ = i; showQuestion(); }

    function changeQuestion(dir) {
        if (dir === 1 && currentQ === questions.length - 1) {
            submitExam(false); // Pass false because it is a manual submit attempt
        } else { 
            currentQ += dir; 
            showQuestion(); 
        }
    }

    async function submitExam(isAutoSubmit = false) {
        // Warning check for missing answers
        if (!isAutoSubmit) {
            const unansweredCount = userAnswers.filter(ans => ans === null).length;
            if (unansweredCount > 0) {
                const confirmSubmit = confirm(`You have left ${unansweredCount} question(s) unanswered. Are you sure you want to finish and submit?`);
                if (!confirmSubmit) return; // Stop submission if they click Cancel
            }
        }

        clearInterval(timerInterval);
        let score = 0;
        let topicMap = {};
        let reviewHTML = "";
        let missedQuestions = [];

        questions.forEach((q, i) => {
            const correct = userAnswers[i] === q.ans;
            if (correct) {
                score++;
            } else {
                missedQuestions.push("Q" + (i + 1));
            }
            if (!topicMap[q.topic]) topicMap[q.topic] = { total: 0, correct: 0, failedQ: [] };
            topicMap[q.topic].total++;
            if (correct) topicMap[q.topic].correct++;
            else topicMap[q.topic].failedQ.push(i + 1);

            reviewHTML += `<div class="review-card ${correct ? 'status-correct' : ''}">
                <strong>Q${i+1}:</strong> ${q.q}<br>
                Your Answer: <span style="color:${correct ? '#81c784' : '#ff5252'}">${userAnswers[i] !== null ? q.options[userAnswers[i]] : 'Skipped'}</span><br>
                Correct: ${q.options[q.ans]}<br>
                <em>Explanation: ${q.explain}</em></div>`;
        });

        const scoreStr = `${score}/${questions.length}`;
        let wrongAnswersString = missedQuestions.length > 0 ? missedQuestions.join(", ") : "None";

        document.getElementById('page-exam').classList.remove('active');
        document.getElementById('page-result').classList.add('active');
        document.getElementById('res-name').innerText = studentName;
        document.getElementById('final-score').innerText = scoreStr;
        document.getElementById('review-list').innerHTML = reviewHTML;

        let analysis = `<strong>AI Analysis Feedback (Question-Specific):</strong><br><br>`;
        for (let t in topicMap) {
            let pct = (topicMap[t].correct / topicMap[t].total) * 100;
            if (pct === 100) {
                analysis += `• Mastery achieved in ${t}. Your concepts are perfectly clear.<br>`;
            } else if (pct >= 60) {
                analysis += `• Strong foundation in ${t}, but minor errors occurred in Question(s) ${topicMap[t].failedQ.join(', ')}.<br>`;
            } else {
                analysis += `• Weak performance in ${t}. For example, in Question(s) ${topicMap[t].failedQ.join(', ')}, you failed to apply the rules correctly.<br>`;
            }
        }
        document.getElementById('ai-analysis').innerHTML = analysis;

        fetch(WEB_APP_URL, { 
            method: "POST", 
            mode: "no-cors", 
            body: JSON.stringify({ 
                studentName, 
                standard: HARDCODED_STD, 
                examName: EXAM_NAME, 
                subject: HARDCODED_SUBJECT,
                score: scoreStr, 
                wrongAnswers: wrongAnswersString 
            }) 
        });
        
        localStorage.setItem('submitted_data_' + EXAM_KEY, JSON.stringify({ name: studentName, answers: userAnswers, score: scoreStr, topicMap }));
        sessionStorage.clear();
        window.scrollTo(0, 0);
    }

    window.onload = () => {
        document.getElementById('exam-title-display').innerHTML = `<strong>Topic:</strong> ${EXAM_NAME}`;
        const saved = localStorage.getItem('submitted_data_' + EXAM_KEY);
        if (saved) {
            const data = JSON.parse(saved);
            studentName = data.name;
            userAnswers = data.answers;
            showResultsFromStorage(data);
        } else if (sessionStorage.getItem('in_progress_' + EXAM_KEY)) {
            studentName = sessionStorage.getItem('name');
            userAnswers = JSON.parse(sessionStorage.getItem('answers')) || userAnswers;
            currentQ = parseInt(sessionStorage.getItem('currentQ')) || 0;
            timeRemaining = parseInt(sessionStorage.getItem('time_remaining')) || 1800;
            document.getElementById('page-landing').classList.remove('active');
            document.getElementById('page-exam').classList.add('active');
            startTimer();
            updateTimerDisplay();
            renderGrid();
            showQuestion();
        }
    };

    function showResultsFromStorage(data) {
        document.getElementById('page-landing').classList.remove('active');
        document.getElementById('page-result').classList.add('active');
        document.getElementById('res-name').innerText = data.name;
        document.getElementById('final-score').innerText = data.score;
        let reviewHTML = "";
        questions.forEach((q, i) => {
            const correct = userAnswers[i] === q.ans;
            reviewHTML += `<div class="review-card ${correct ? 'status-correct' : ''}">
                <strong>Q${i+1}:</strong> ${q.q}<br>
                Your Answer: <span style="color:${correct ? '#81c784' : '#ff5252'}">${userAnswers[i] !== null ? q.options[userAnswers[i]] : 'Skipped'}</span><br>
                Correct: ${q.options[q.ans]}<br>
                <em>Explanation: ${q.explain}</em></div>`;
        });
        document.getElementById('review-list').innerHTML = reviewHTML;
        let analysis = `<strong>AI Analysis Feedback (Question-Specific):</strong><br><br>`;
        for (let t in data.topicMap) {
            let pct = (data.topicMap[t].correct / data.topicMap[t].total) * 100;
            if (pct === 100) {
                analysis += `• Mastery achieved in ${t}. Your concepts are perfectly clear.<br>`;
            } else if (pct >= 60) {
                analysis += `• Strong foundation in ${t}, but minor errors occurred in Question(s) ${data.topicMap[t].failedQ.join(', ')}.<br>`;
            } else {
                analysis += `• Weak performance in ${t}. For example, in Question(s) ${data.topicMap[t].failedQ.join(', ')}, you failed to apply the rules correctly.<br>`;
            }
        }
        document.getElementById('ai-analysis').innerHTML = analysis;
    }
</script>
