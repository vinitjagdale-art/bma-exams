<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5th Maths Olympiad - Master Template</title>
    
    <script>
      MathJax = {
        tex: { inlineMath: [['$', '$']] }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        /* Faint Orange Theme for 5th Maths Olympiad */
        :root { 
            --primary-bg: #4a3521; 
            --text-color: #ffffff; 
            --accent-color: #e67e22; /* Faint Orange */
            --error: #ff5252; 
            --correct: #81c784; 
            --answered: #ff9800; 
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--primary-bg); color: var(--text-color); margin: 0; padding: 10px; display: flex; justify-content: center; }
        #exam-container { width: 100%; max-width: 850px; background: rgba(255, 255, 255, 0.1); padding: 1.5rem; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .page { display: none; }
        .active { display: block; }
        #nav-grid { 
            display: grid; 
            grid-template-columns: repeat(10, 35px); 
            justify-content: center; 
            gap: 12px; 
            margin-top: 20px; 
            background: rgba(0,0,0,0.2); 
            padding: 15px; 
            border-radius: 8px; 
        }
        .nav-box { 
            width: 35px; 
            height: 35px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 50%; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.9rem; 
            transition: all 0.3s ease; 
        }
        .nav-box.current { 
            background: var(--accent-color); 
            border: 2px solid #fff; 
            box-shadow: 0 0 10px var(--accent-color), 0 0 20px var(--accent-color); 
            color: #fff; 
        }
        .nav-box.answered { 
            background: var(--answered); 
            border: 2px solid #fff;
            box-shadow: 0 0 8px var(--answered), 0 0 15px var(--answered); 
            color: #fff;
        }
        .info-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; font-size: 0.9rem; }
        .header-main { text-align: center; border-bottom: 2px solid var(--accent-color); margin-bottom: 15px; padding-bottom: 10px; }
        #question-scroll-area { max-height: 60vh; overflow-y: auto; padding-right: 10px; margin-top: 10px; }
        .option-label { display: flex; align-items: center; background: rgba(255,255,255,0.05); margin: 10px 0; padding: 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .option-label:hover { background: rgba(255,255,255,0.12); }
        input[type="radio"] { margin-right: 15px; transform: scale(1.2); }
        .btn-container { margin-top: 20px; display: flex; justify-content: space-between; }
        button { padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; background: var(--accent-color); color: white; font-weight: bold; }
        .review-card { background: rgba(0,0,0,0.3); padding: 15px; margin: 15px 0; border-radius: 8px; border-left: 5px solid var(--error); }
        .review-card.status-correct { border-left-color: var(--correct); }
    </style>
</head>
<body>

<div id="exam-container">
    <div id="page-landing" class="page active">
        <h1 class="header-main">5th Maths Olympiad</h1>
        <div class="info-box" style="display: block;">
            <p><strong>Subject:</strong> <span id="display-subject">Maths</span></p>
            <p id="exam-title-display"><strong>Topic:</strong> Loading...</p>
            <p><strong>Standard:</strong> <span id="display-std">5th</span> | <strong>Marks:</strong> <span id="display-total-marks">20</span> | <strong>Time:</strong> <span id="display-total-time">30</span> Mins</p>
        </div>
        <div style="margin: 30px 0; text-align: center;">
            <input type="text" id="student-name" placeholder="Enter Full Student Name" style="width: 80%; padding: 12px; border-radius: 6px; border: none;">
        </div>
        <div style="text-align: center;"><button onclick="startExam()">Start Assignment</button></div>
    </div>

    <div id="page-exam" class="page">
        <div class="header-main" style="font-size: 1.2rem;">5th Maths Olympiad</div>
        <div class="info-box">
            <span><strong>Time Left:</strong> <span id="timer-display">Loading...</span></span>
            <span><strong>Marks:</strong> <span id="exam-marks-display">20</span></span>
            <span><strong>Questions:</strong> <span id="exam-questions-display">20</span></span>
        </div>
        <div id="question-scroll-area">
            <h3 id="q-title"></h3>
            <p id="q-text" style="font-size: 1.1rem; line-height: 1.6;"></p>
            <div id="options-container"></div>
        </div>
        <div class="btn-container">
            <button id="prev-btn" onclick="changeQuestion(-1)">Back</button>
            <button id="next-btn" onclick="changeQuestion(1)">Next</button>
        </div>
        <div id="nav-grid"></div>
    </div>

    <div id="page-result" class="page">
        <h2 id="res-name" style="text-align: center;"></h2>
        <h1 style="text-align: center;">Score: <span id="final-score"></span></h1>
        <div id="ai-analysis" style="background: rgba(230, 126, 34, 0.15); padding: 20px; border-radius: 10px; margin: 20px 0; line-height: 1.5;"></div>
        <h3>Question Review</h3>
        <div id="review-list"></div>
    </div>
</div>

<script>
    // ==========================================
    // 1. UPDATE THESE VARIABLES FOR EVERY NEW EXAM
    // ==========================================
    const EXAM_KEY = "5th-operation-on-fractions-test-3"; // Must be unique so localStorage doesn't overlap
    const EXAM_NAME = "Operation on Fractions Test 3"; 
    
    const HARDCODED_STD = "5th";
    const HARDCODED_SUBJECT = "Maths";
    
    let timeRemaining = 1800; // Time in seconds (e.g., 1800 = 30 Minutes)

    // ==========================================
    // 2. PASTE JSON QUESTION DATA HERE
    // ==========================================
    const questions = [
  {
    "q": "Neha has a piece of lace $\\frac{8}{9}$ metres long. She wants to cut it into pieces that are $\\frac{1}{9}$ metres long. How many pieces will she get?",
    "options": ["9", "10", "8", "11"],
    "ans": 2,
    "topic": "Division of Fractions (Word Problem)",
    "explain": "To find the number of pieces, divide the total length by the length of each piece: $\\frac{8}{9} \\div \\frac{1}{9}$. Multiplying by the reciprocal gives $\\frac{8}{9} \\times 9 = 8$ pieces."
  },
  {
    "q": "Shikha has $\\frac{3}{4}$ kilogram of toffees. She wants to distribute them equally among 3 of her friends. How many kilograms of toffees will each get?",
    "options": ["$\\frac{1}{4}$ kg", "$\\frac{3}{2}$ kg", "$\\frac{1}{2}$ kg", "1 kg"],
    "ans": 0,
    "topic": "Division by a Whole Number",
    "explain": "Divide the total amount by 3: $\\frac{3}{4} \\div 3$. This is the same as $\\frac{3}{4} \\times \\frac{1}{3}$. The 3s cancel out, leaving $\\frac{1}{4}$ kg per friend."
  },
  {
    "q": "A cake weighing 2 kg is divided into 5 equal parts. Then, each part is further divided into 4 equal parts. Find the weight of each final part.",
    "options": ["60 g", "80 g", "100 g", "120 g"],
    "ans": 2,
    "topic": "Successive Division",
    "explain": "Convert 2 kg to 2000 g. Divided into 5 parts, each is $2000 \\div 5 = 400$ g. When divided again by 4, each final piece weighs $400 \\div 4 = 100$ g."
  },
  {
    "q": "The distance between two stations is 25 km. A train starts from one station and goes 15 km towards the other. What fraction of the total distance is left to be covered?",
    "options": ["$\\frac{3}{5}$", "$\\frac{4}{5}$", "$\\frac{2}{5}$", "$\\frac{1}{4}$"],
    "ans": 2,
    "topic": "Fractional Representation",
    "explain": "The total distance is 25 km. Distance covered is 15 km, so the remaining distance is $25 - 15 = 10$ km. The fraction left is $\\frac{10}{25}$, which simplifies to $\\frac{2}{5}$."
  },
  {
    "q": "A man sold $\\frac{1}{2}$ of his land. He gave $\\frac{1}{2}$ of the remaining portion to his son. What fraction of the total land is left with him?",
    "options": ["$\\frac{1}{2}$", "$\\frac{1}{3}$", "$\\frac{1}{4}$", "$\\frac{1}{5}$"],
    "ans": 2,
    "topic": "Fraction of a Remainder",
    "explain": "After selling $\\frac{1}{2}$, he is left with $\\frac{1}{2}$ of his land. He gives half of this remainder to his son: $\\frac{1}{2} \\times \\frac{1}{2} = \\frac{1}{4}$. The fraction he keeps is $\\frac{1}{2} - \\frac{1}{4} = \\frac{1}{4}$."
  },
  {
    "q": "A water tank is $\\frac{1}{3}$ full. When 20 liters of water are added, it becomes $\\frac{3}{4}$ full. What is the total capacity of the tank?",
    "options": ["40 liters", "48 liters", "56 liters", "60 liters"],
    "ans": 1,
    "topic": "Multi-step Capacity Problem",
    "explain": "The fraction of the tank filled by the 20 liters is $\\frac{3}{4} - \\frac{1}{3} = \\frac{9}{12} - \\frac{4}{12} = \\frac{5}{12}$. Since $\\frac{5}{12}$ of the capacity is 20 liters, the total capacity is $20 \\div \\frac{5}{12} = 20 \\times \\frac{12}{5} = 48$ liters."
  },
  {
    "q": "Alice spends $\\frac{1}{4}$ of her money on clothes, and $\\frac{2}{5}$ of the remaining money on food. If she is left with $45, how much money did she have initially?",
    "options": ["$80", "$90", "$100", "$120"],
    "ans": 2,
    "topic": "Fraction of a Remainder",
    "explain": "After clothes, she has $\\frac{3}{4}$ of her money left. She spends $\\frac{2}{5}$ of this on food: $\\frac{2}{5} \\times \\frac{3}{4} = \\frac{6}{20} = \\frac{3}{10}$. Total spent: $\\frac{1}{4} + \\frac{3}{10} = \\frac{11}{20}$. She is left with $\\frac{9}{20}$, which equals 45. Initial money $= 45 \\times \\frac{20}{9} = 100$."
  },
  {
    "q": "Bob reads $\\frac{1}{5}$ of a book on Monday and $\\frac{3}{8}$ of the remaining pages on Tuesday. If he still has 150 pages left to read, what is the total number of pages in the book?",
    "options": ["240", "300", "360", "400"],
    "ans": 1,
    "topic": "Successive Fractions",
    "explain": "Pages left after Monday = $\\frac{4}{5}$. Read on Tuesday = $\\frac{3}{8} \\times \\frac{4}{5} = \\frac{3}{10}$. Total fraction read = $\\frac{1}{5} + \\frac{3}{10} = \\frac{5}{10} = \\frac{1}{2}$. Since the unread half equals 150 pages, the book has $150 \\times 2 = 300$ pages."
  },
  {
    "q": "A rubber ball is dropped from a height of 81 meters. On each bounce, it rises to $\\frac{2}{3}$ of its previous height. How high does it rise after its third bounce?",
    "options": ["24 meters", "36 meters", "18 meters", "12 meters"],
    "ans": 0,
    "topic": "Repeated Multiplication",
    "explain": "First bounce: $81 \\times \\frac{2}{3} = 54$ m. Second bounce: $54 \\times \\frac{2}{3} = 36$ m. Third bounce: $36 \\times \\frac{2}{3} = 24$ m."
  },
  {
    "q": "In a school, $\\frac{3}{5}$ of the students are girls. If $\\frac{1}{4}$ of the girls and $\\frac{1}{3}$ of the boys play soccer, what fraction of the total students play soccer?",
    "options": ["$\\frac{17}{60}$", "$\\frac{13}{60}$", "$\\frac{1}{4}$", "$\\frac{7}{20}$"],
    "ans": 0,
    "topic": "Fractions of Distinct Groups",
    "explain": "Girls playing soccer = $\\frac{1}{4} \\times \\frac{3}{5} = \\frac{3}{20}$. Boys are $1 - \\frac{3}{5} = \\frac{2}{5}$ of the school. Boys playing soccer = $\\frac{1}{3} \\times \\frac{2}{5} = \\frac{2}{15}$. Total players = $\\frac{3}{20} + \\frac{2}{15} = \\frac{9}{60} + \\frac{8}{60} = \\frac{17}{60}$."
  },
  {
    "q": "Pipe A can fill a tank in 4 hours and Pipe B can fill it in 6 hours. If both pipes are opened together for 2 hours, what fraction of the tank will be filled?",
    "options": ["$\\frac{2}{5}$", "$\\frac{3}{4}$", "$\\frac{5}{6}$", "1 (Completely Full)"],
    "ans": 2,
    "topic": "Work and Time Rates",
    "explain": "In 1 hour, Pipe A fills $\\frac{1}{4}$ and Pipe B fills $\\frac{1}{6}$. Together in 1 hour they fill $\\frac{1}{4} + \\frac{1}{6} = \\frac{5}{12}$. In 2 hours, they will fill $2 \\times \\frac{5}{12} = \\frac{5}{6}$ of the tank."
  },
  {
    "q": "A traveler covers $\\frac{2}{7}$ of his journey by train, $\\frac{3}{5}$ by bus, and walks the remaining 8 km. What is the total length of his journey?",
    "options": ["56 km", "60 km", "70 km", "84 km"],
    "ans": 2,
    "topic": "Addition and Subtraction of Fractions",
    "explain": "Fraction traveled = $\\frac{2}{7} + \\frac{3}{5} = \\frac{10}{35} + \\frac{21}{35} = \\frac{31}{35}$. The fraction left for walking is $1 - \\frac{31}{35} = \\frac{4}{35}$. Since $\\frac{4}{35}$ equals 8 km, the total journey is $8 \\times \\frac{35}{4} = 70$ km."
  },
  {
    "q": "A pole is standing in a pond. $\\frac{1}{4}$ of the pole's length is buried in the mud, $\\frac{1}{3}$ of it is submerged in the water, and 10 meters of it is above the water. What is the total length of the pole?",
    "options": ["20 meters", "24 meters", "30 meters", "36 meters"],
    "ans": 1,
    "topic": "Multi-step Word Problems",
    "explain": "Buried and submerged fraction = $\\frac{1}{4} + \\frac{1}{3} = \\frac{7}{12}$. The fraction above water is $1 - \\frac{7}{12} = \\frac{5}{12}$. Since $\\frac{5}{12}$ corresponds to 10 meters, the total length is $10 \\times \\frac{12}{5} = 24$ meters."
  },
  {
    "q": "John gives $\\frac{1}{5}$ of his monthly salary to his mother, $\\frac{1}{2}$ of the remaining amount to his sister, and saves the rest. If his savings are $400, what is his total monthly salary?",
    "options": ["$800", "$1000", "$1200", "$1500"],
    "ans": 1,
    "topic": "Fraction of a Remainder",
    "explain": "After his mother, he has $\\frac{4}{5}$ left. He gives $\\frac{1}{2}$ of this to his sister: $\\frac{1}{2} \\times \\frac{4}{5} = \\frac{2}{5}$. He is left with $\\frac{4}{5} - \\frac{2}{5} = \\frac{2}{5}$. If $\\frac{2}{5}$ equals 400, his total salary is $400 \\times \\frac{5}{2} = 1000$."
  },
  {
    "q": "If $\\frac{3}{4}$ of a number is 18 more than $\\frac{1}{2}$ of the same number, what is the number?",
    "options": ["54", "64", "72", "84"],
    "ans": 2,
    "topic": "Algebraic Fractions",
    "explain": "Let the number be x. The problem states $\\frac{3}{4}x - \\frac{1}{2}x = 18$. Converting to common denominators: $\\frac{3}{4}x - \\frac{2}{4}x = \\frac{1}{4}x = 18$. Therefore, $x = 18 \\times 4 = 72$."
  },
  {
    "q": "In a basket of apples, $\\frac{1}{6}$ are rotten. The shopkeeper sells $\\frac{2}{5}$ of the good apples. If he still has 30 good apples left, what was the total number of apples initially in the basket?",
    "options": ["48", "50", "60", "72"],
    "ans": 2,
    "topic": "Complex Multi-step Logic",
    "explain": "He sells $\\frac{2}{5}$ of the good apples, so he keeps $\\frac{3}{5}$ of the good apples. This $\\frac{3}{5}$ equals 30, so total good apples = $30 \\times \\frac{5}{3} = 50$. Since $\\frac{1}{6}$ are rotten, the 50 good apples represent $\\frac{5}{6}$ of the total. Total apples = $50 \\times \\frac{6}{5} = 60$."
  },
  {
    "q": "A printer uses $\\frac{1}{8}$ of a ream of paper to print one technical manual. How many complete manuals can be printed from $3\\frac{1}{2}$ reams of paper?",
    "options": ["24", "26", "28", "30"],
    "ans": 2,
    "topic": "Division of Mixed Fractions",
    "explain": "Divide the total paper by the amount used per manual: $3\\frac{1}{2} \\div \\frac{1}{8}$. Convert to an improper fraction: $\\frac{7}{2} \\div \\frac{1}{8} = \\frac{7}{2} \\times \\frac{8}{1} = 28$ manuals."
  },
  {
    "q": "A gardener mows $\\frac{2}{9}$ of a lawn in $\\frac{3}{4}$ of an hour. At this constant rate, how many hours will it take him to mow the entire lawn?",
    "options": ["$2\\frac{1}{4}$ hours", "$3\\frac{3}{8}$ hours", "$3\\frac{1}{2}$ hours", "$4\\frac{1}{8}$ hours"],
    "ans": 1,
    "topic": "Rates and Fractions",
    "explain": "To find the time for 1 whole lawn, divide the time taken by the fraction completed: $\\frac{3}{4} \\div \\frac{2}{9}$. This becomes $\\frac{3}{4} \\times \\frac{9}{2} = \\frac{27}{8}$, which is equal to $3\\frac{3}{8}$ hours."
  },
  {
    "q": "A container is fully filled with milk. $\\frac{1}{4}$ of the milk is replaced by water. Then, $\\frac{1}{3}$ of the new mixture is replaced by water. What fraction of the final mixture is milk?",
    "options": ["$\\frac{1}{2}$", "$\\frac{1}{3}$", "$\\frac{5}{12}$", "$\\frac{1}{4}$"],
    "ans": 0,
    "topic": "Successive Replacement",
    "explain": "After the first replacement, $\\frac{3}{4}$ of the container is milk. During the second replacement, $\\frac{1}{3}$ of the mixture (and thus $\\frac{1}{3}$ of the milk) is removed. The milk remaining is $\\frac{2}{3}$ of $\\frac{3}{4}$, which is $\\frac{2}{3} \\times \\frac{3}{4} = \\frac{1}{2}$."
  },
  {
    "q": "A family consumes $2\\frac{1}{2}$ liters of milk every day. How many liters of milk will they consume in the month of April?",
    "options": ["60 liters", "70 liters", "75 liters", "80 liters"],
    "ans": 2,
    "topic": "Multiplication of Mixed Fractions",
    "explain": "April has 30 days. Multiply the daily consumption by 30: $2\\frac{1}{2} \\times 30$. Convert to improper fraction: $\\frac{5}{2} \\times 30 = 5 \\times 15 = 75$ liters."
  }
];

    // ==========================================
    // DO NOT CHANGE ANYTHING BELOW THIS LINE
    // ==========================================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwEutZaKIAodDqKVocXPmgGlsfyO6ma8vuQK4sFgEobmvD73QQwztuH4qbT_R3g1Figtw/exec";
    
    let timerInterval;
    let currentQ = 0;
    let userAnswers = []; 
    let studentName = "";

    function startTimer() {
        timerInterval = setInterval(() => {
            timeRemaining--;
            sessionStorage.setItem('time_remaining', timeRemaining);
            updateTimerDisplay();
            if (timeRemaining <= 0) { 
                clearInterval(timerInterval); 
                submitExam(true); 
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        document.getElementById('timer-display').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function startExam() {
        studentName = document.getElementById('student-name').value.trim();
        if (!studentName) return alert("Please enter your name");
        sessionStorage.setItem('name', studentName);
        sessionStorage.setItem('in_progress_' + EXAM_KEY, "true");
        document.getElementById('page-landing').classList.remove('active');
        document.getElementById('page-exam').classList.add('active');
        startTimer();
        renderGrid();
        showQuestion();
    }

    function renderGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = "";
        questions.forEach((_, i) => {
            const div = document.createElement('div');
            div.className = `nav-box ${i === currentQ ? 'current' : ''} ${userAnswers[i] !== null ? 'answered' : ''}`;
            div.innerText = i + 1;
            div.onclick = () => jumpTo(i);
            grid.appendChild(div);
        });
    }

    function showQuestion() {
        const q = questions[currentQ];
        document.getElementById('q-title').innerText = `Question ${currentQ + 1}`;
        document.getElementById('q-text').innerHTML = q.q;
        const optCont = document.getElementById('options-container');
        optCont.innerHTML = "";
        q.options.forEach((opt, idx) => {
            const lbl = document.createElement('label');
            lbl.className = "option-label";
            lbl.innerHTML = `<input type="radio" name="opt" ${userAnswers[currentQ] === idx ? 'checked' : ''} onchange="saveAns(${idx})"> <div>${opt}</div>`;
            optCont.appendChild(lbl);
        });
        document.getElementById('next-btn').innerText = currentQ === questions.length - 1 ? "Finish" : "Next";
        sessionStorage.setItem('currentQ', currentQ);
        renderGrid();
        
        // Tells MathJax to render the newly injected LaTeX formulas
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function saveAns(idx) {
        userAnswers[currentQ] = idx;
        sessionStorage.setItem('answers', JSON.stringify(userAnswers));
        renderGrid();
    }

    function jumpTo(i) { currentQ = i; showQuestion(); }

    function changeQuestion(dir) {
        if (dir === 1 && currentQ === questions.length - 1) {
            submitExam(false); 
        } else { 
            currentQ += dir; 
            showQuestion(); 
        }
    }

    async function submitExam(isAutoSubmit = false) {
        if (!isAutoSubmit) {
            const unansweredCount = userAnswers.filter(ans => ans === null).length;
            if (unansweredCount > 0) {
                const confirmSubmit = confirm(`You have left ${unansweredCount} question(s) unanswered. Are you sure you want to finish and submit?`);
                if (!confirmSubmit) return; 
            }
        }

        clearInterval(timerInterval);
        let score = 0;
        let topicMap = {};
        let reviewHTML = "";
        let missedQuestions = [];

        questions.forEach((q, i) => {
            const correct = userAnswers[i] === q.ans;
            if (correct) {
                score++;
            } else {
                missedQuestions.push("Q" + (i + 1));
            }
            if (!topicMap[q.topic]) topicMap[q.topic] = { total: 0, correct: 0, failedQ: [] };
            topicMap[q.topic].total++;
            if (correct) topicMap[q.topic].correct++;
            else topicMap[q.topic].failedQ.push(i + 1);

            reviewHTML += `<div class="review-card ${correct ? 'status-correct' : ''}">
                <strong>Q${i+1}:</strong> ${q.q}<br>
                Your Answer: <span style="color:${correct ? '#81c784' : '#ff5252'}">${userAnswers[i] !== null ? q.options[userAnswers[i]] : 'Skipped'}</span><br>
                Correct: ${q.options[q.ans]}<br>
                <em>Explanation: ${q.explain}</em></div>`;
        });

        const scoreStr = `${score}/${questions.length}`;
        let wrongAnswersString = missedQuestions.length > 0 ? missedQuestions.join(", ") : "None";

        document.getElementById('page-exam').classList.remove('active');
        document.getElementById('page-result').classList.add('active');
        document.getElementById('res-name').innerText = studentName;
        document.getElementById('final-score').innerText = scoreStr;
        document.getElementById('review-list').innerHTML = reviewHTML;

        let analysis = `<strong>AI Analysis Feedback (Question-Specific):</strong><br><br>`;
        for (let t in topicMap) {
            let pct = (topicMap[t].correct / topicMap[t].total) * 100;
            if (pct === 100) {
                analysis += `• Mastery achieved in ${t}. Your concepts are perfectly clear.<br>`;
            } else if (pct >= 60) {
                analysis += `• Strong foundation in ${t}, but minor errors occurred in Question(s) ${topicMap[t].failedQ.join(', ')}.<br>`;
            } else {
                analysis += `• Weak performance in ${t}. For example, in Question(s) ${topicMap[t].failedQ.join(', ')}, you failed to apply the rules correctly.<br>`;
            }
        }
        document.getElementById('ai-analysis').innerHTML = analysis;

        // Render MathJax in the review section
        if (window.MathJax) {
            MathJax.typesetPromise();
        }

        fetch(WEB_APP_URL, { 
            method: "POST", 
            mode: "no-cors", 
            body: JSON.stringify({ 
                studentName, 
                standard: HARDCODED_STD, 
                examName: EXAM_NAME, 
                subject: HARDCODED_SUBJECT,
                score: scoreStr, 
                wrongAnswers: wrongAnswersString 
            }) 
        });
        
        localStorage.setItem('submitted_data_' + EXAM_KEY, JSON.stringify({ name: studentName, answers: userAnswers, score: scoreStr, topicMap }));
        sessionStorage.clear();
        window.scrollTo(0, 0);
    }

    window.onload = () => {
        // Initialize dynamic UI elements based on variables
        userAnswers = new Array(questions.length).fill(null);
        document.getElementById('exam-title-display').innerHTML = `<strong>Topic:</strong> ${EXAM_NAME}`;
        document.getElementById('display-subject').innerText = HARDCODED_SUBJECT;
        document.getElementById('display-std').innerText = HARDCODED_STD;
        document.getElementById('display-total-marks').innerText = questions.length;
        document.getElementById('exam-marks-display').innerText = questions.length;
        document.getElementById('exam-questions-display').innerText = questions.length;
        document.getElementById('display-total-time').innerText = Math.floor(timeRemaining / 60);

        const saved = localStorage.getItem('submitted_data_' + EXAM_KEY);
        if (saved) {
            const data = JSON.parse(saved);
            studentName = data.name;
            userAnswers = data.answers;
            showResultsFromStorage(data);
        } else if (sessionStorage.getItem('in_progress_' + EXAM_KEY)) {
            studentName = sessionStorage.getItem('name');
            userAnswers = JSON.parse(sessionStorage.getItem('answers')) || userAnswers;
            currentQ = parseInt(sessionStorage.getItem('currentQ')) || 0;
            timeRemaining = parseInt(sessionStorage.getItem('time_remaining')) || timeRemaining;
            document.getElementById('page-landing').classList.remove('active');
            document.getElementById('page-exam').classList.add('active');
            startTimer();
            updateTimerDisplay();
            renderGrid();
            showQuestion();
        } else {
            updateTimerDisplay();
        }
    };

    function showResultsFromStorage(data) {
        document.getElementById('page-landing').classList.remove('active');
        document.getElementById('page-result').classList.add('active');
        document.getElementById('res-name').innerText = data.name;
        document.getElementById('final-score').innerText = data.score;
        let reviewHTML = "";
        questions.forEach((q, i) => {
            const correct = userAnswers[i] === q.ans;
            reviewHTML += `<div class="review-card ${correct ? 'status-correct' : ''}">
                <strong>Q${i+1}:</strong> ${q.q}<br>
                Your Answer: <span style="color:${correct ? '#81c784' : '#ff5252'}">${userAnswers[i] !== null ? q.options[userAnswers[i]] : 'Skipped'}</span><br>
                Correct: ${q.options[q.ans]}<br>
                <em>Explanation: ${q.explain}</em></div>`;
        });
        document.getElementById('review-list').innerHTML = reviewHTML;
        let analysis = `<strong>AI Analysis Feedback (Question-Specific):</strong><br><br>`;
        for (let t in data.topicMap) {
            let pct = (data.topicMap[t].correct / data.topicMap[t].total) * 100;
            if (pct === 100) {
                analysis += `• Mastery achieved in ${t}. Your concepts are perfectly clear.<br>`;
            } else if (pct >= 60) {
                analysis += `• Strong foundation in ${t}, but minor errors occurred in Question(s) ${data.topicMap[t].failedQ.join(', ')}.<br>`;
            } else {
                analysis += `• Weak performance in ${t}. For example, in Question(s) ${data.topicMap[t].failedQ.join(', ')}, you failed to apply the rules correctly.<br>`;
            }
        }
        document.getElementById('ai-analysis').innerHTML = analysis;
        
        // Render MathJax in the loaded review section
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }
</script>
</body>
</html>
