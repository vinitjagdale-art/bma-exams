<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright Minds Academy - 10th English Grammar</title>
    <style>
        /* Distinct Green Theme for English Grammar */
        :root { 
            --primary-bg: #173627; 
            --text-color: #ffffff; 
            --accent-color: #2bb872; 
            --error: #ff5252; 
            --correct: #81c784; 
            --answered: #ff9800; 
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--primary-bg); color: var(--text-color); margin: 0; padding: 10px; display: flex; justify-content: center; }
        #exam-container { width: 100%; max-width: 850px; background: rgba(255, 255, 255, 0.1); padding: 1.5rem; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .page { display: none; }
        .active { display: block; }
       #nav-grid { 
    display: grid; 
    grid-template-columns: repeat(10, 35px); /* Locks width to make perfect circles */
    justify-content: center; /* Centers the circles in the box */
    gap: 12px; /* Slightly wider gap so glowing borders don't overlap */
    margin-top: 20px; 
    background: rgba(0,0,0,0.2); 
    padding: 15px; 
    border-radius: 8px; 
}
.nav-box { 
    width: 35px; /* Explicit width added */
    height: 35px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    border-radius: 50%; /* This makes the box a perfect circle */
    background: rgba(255, 255, 255, 0.05); /* Dimmed default state */
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    cursor: pointer; 
    font-weight: bold; 
    font-size: 0.9rem; 
    transition: all 0.3s ease; /* Smooth fade when glowing */
}
/* Neon Green Glow for Current Question */
.nav-box.current { 
    background: var(--accent-color); 
    border: 2px solid #fff; 
    box-shadow: 0 0 10px var(--accent-color), 0 0 20px var(--accent-color); 
    color: var(--primary-bg); /* Dark text to stand out against bright green */
}
/* Neon Orange/Amber Glow for Answered Questions */
.nav-box.answered { 
    background: var(--answered); 
    border: 2px solid #fff;
    box-shadow: 0 0 8px var(--answered), 0 0 15px var(--answered); 
    color: #fff;
}
        .info-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; font-size: 0.9rem; }
        .header-main { text-align: center; border-bottom: 2px solid var(--accent-color); margin-bottom: 15px; padding-bottom: 10px; }
        #question-scroll-area { max-height: 60vh; overflow-y: auto; padding-right: 10px; margin-top: 10px; }
        .option-label { display: block; background: rgba(255,255,255,0.05); margin: 10px 0; padding: 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .option-label:hover { background: rgba(255,255,255,0.12); }
        input[type="radio"] { margin-right: 12px; transform: scale(1.2); }
        .btn-container { margin-top: 20px; display: flex; justify-content: space-between; }
        button { padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; background: var(--accent-color); color: white; font-weight: bold; }
        .review-card { background: rgba(0,0,0,0.3); padding: 15px; margin: 15px 0; border-radius: 8px; border-left: 5px solid var(--error); }
        .review-card.status-correct { border-left-color: var(--correct); }
    </style>
</head>
<body>

<div id="exam-container">
    <div id="page-landing" class="page active">
        <h1 class="header-main">Bright Minds Academy</h1>
        <div class="info-box" style="display: block;">
            <p><strong>Subject:</strong> English</p>
            <p id="exam-title-display"><strong>Topic:</strong> Loading...</p>
            <p><strong>Standard:</strong> 10th | <strong>Marks:</strong> 30 | <strong>Time:</strong> 30 Mins</p>
        </div>
        <div style="margin: 30px 0; text-align: center;">
            <input type="text" id="student-name" placeholder="Enter Full Student Name" style="width: 80%; padding: 12px; border-radius: 6px; border: none;">
        </div>
        <div style="text-align: center;"><button onclick="startExam()">Start Assignment</button></div>
    </div>

    <div id="page-exam" class="page">
        <div class="header-main" style="font-size: 1.2rem;">Bright Minds Academy</div>
        <div class="info-box">
            <span><strong>Time Left:</strong> <span id="timer-display">30:00</span></span>
            <span><strong>Marks:</strong> 30</span>
            <span><strong>Questions:</strong> 30</span>
        </div>
        <div id="question-scroll-area">
            <h3 id="q-title"></h3>
            <p id="q-text" style="font-size: 1.1rem; line-height: 1.6;"></p>
            <div id="options-container"></div>
        </div>
        <div class="btn-container">
            <button id="prev-btn" onclick="changeQuestion(-1)">Back</button>
            <button id="next-btn" onclick="changeQuestion(1)">Next</button>
        </div>
        <div id="nav-grid"></div>
    </div>

    <div id="page-result" class="page">
        <h2 id="res-name" style="text-align: center;"></h2>
        <h1 style="text-align: center;">Score: <span id="final-score"></span></h1>
        <div id="ai-analysis" style="background: rgba(76, 175, 80, 0.15); padding: 20px; border-radius: 10px; margin: 20px 0; line-height: 1.5;"></div>
        <h3>Question Review</h3>
        <div id="review-list"></div>
    </div>
</div>

<script>
    // UPDATE THESE FOR EACH NEW EXAM
    const EXAM_KEY = "10th_Eng_Grammar_non-finite-verbs1"; 
    const EXAM_NAME = "Non-finite Verbs Test 1"; 
    
    // CONSTANTS
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwEutZaKIAodDqKVocXPmgGlsfyO6ma8vuQK4sFgEobmvD73QQwztuH4qbT_R3g1Figtw/exec";
    const HARDCODED_STD = "10th";
    const HARDCODED_SUBJECT = "English";
    
    let timerInterval;
    let timeRemaining = 1800; // 30 Minutes

    // JSON PAYLOAD GOES HERE (Paste the clean JSON array below this line)
    const questions = [
  {
    "q": "Pick out the infinitive from the following sentence: I just had to do it.",
    "options": [
      "had",
      "just",
      "to do",
      "it"
    ],
    "ans": 2,
    "topic": "Infinitive",
    "explain": "'to do' is the infinitive here. It is formed by TO + the base verb 'do', acting as a non-finite verb."
  },
  {
    "q": "Pick out an infinitive from the given sentence: The sun began to sink.",
    "options": [
      "sun",
      "began",
      "to",
      "to sink"
    ],
    "ans": 3,
    "topic": "Infinitive",
    "explain": "'to sink' = TO + base verb 'sink'. It is the object of 'began' and acts as a noun."
  },
  {
    "q": "Pick out the infinitive from the following sentence: Every child is free to grow.",
    "options": [
      "Every",
      "is",
      "free",
      "to grow"
    ],
    "ans": 3,
    "topic": "Infinitive",
    "explain": "'to grow' = TO + base verb 'grow'. It is used here as an adjective modifying 'free'."
  },
  {
    "q": "Pick out the infinitive from the given sentence: These react together to produce photons.",
    "options": [
      "react",
      "together",
      "to produce",
      "photons"
    ],
    "ans": 2,
    "topic": "Infinitive",
    "explain": "'to produce' = TO + base verb 'produce'. It acts as an adverb explaining the purpose of the reaction."
  },
  {
    "q": "Pick out the infinitive from the following sentence: I am not allowed to read comics at home.",
    "options": [
      "am not",
      "allowed",
      "to read",
      "at home"
    ],
    "ans": 2,
    "topic": "Infinitive",
    "explain": "'to read' = TO + base verb 'read'. It is the non-finite verb used as a noun after 'allowed'."
  },
  {
    "q": "Identify the sentence that correctly replaces the gerund with an infinitive: She started competing at international level.",
    "options": [
      "She started to competing at international level.",
      "She started to compete at international level.",
      "She starts to compete at international level.",
      "She started compete at international level."
    ],
    "ans": 1,
    "topic": "Infinitive",
    "explain": "The gerund 'competing' is replaced by the infinitive 'to compete'."
  },
  {
    "q": "Pick out the gerund from the following sentence: This attitude of taking destroys families.",
    "options": [
      "attitude",
      "taking",
      "destroys",
      "families"
    ],
    "ans": 1,
    "topic": "Gerund",
    "explain": "'taking' = verb 'take' + ING. It is used as a noun here, functioning as the object of the preposition 'of'."
  },
  {
    "q": "Identify the gerund in the sentence: Swimming is good for health.",
    "options": [
      "is",
      "good",
      "health",
      "Swimming"
    ],
    "ans": 3,
    "topic": "Gerund",
    "explain": "A gerund acts like a noun. Here, 'Swimming' is the subject of the sentence."
  },
  {
    "q": "Pick out the gerund from the sentence: He loves reading books.",
    "options": [
      "He",
      "loves",
      "reading",
      "books"
    ],
    "ans": 2,
    "topic": "Gerund",
    "explain": "'reading' acts as a noun here and is the object of the verb 'loves'."
  },
  {
    "q": "Identify the gerund in the given sentence: He was afraid of losing.",
    "options": [
      "He",
      "was",
      "afraid",
      "losing"
    ],
    "ans": 3,
    "topic": "Gerund",
    "explain": "'losing' acts as a noun. It is the object of the preposition 'of'."
  },
  {
    "q": "Which of the following contains a gerund?",
    "options": [
      "She is singing a song.",
      "Singing is her favorite hobby.",
      "I heard the singing bird.",
      "They are singing loudly."
    ],
    "ans": 1,
    "topic": "Gerund",
    "explain": "In 'Singing is her favorite hobby', 'Singing' acts as a noun (the subject). In the others, it acts as a verb or adjective."
  },
  {
    "q": "Pick out the gerund from the sentence: Writing stories is her hobby.",
    "options": [
      "Writing",
      "stories",
      "is",
      "hobby"
    ],
    "ans": 0,
    "topic": "Gerund",
    "explain": "'Writing' functions as a noun and is the subject of the sentence."
  },
  {
    "q": "Pick out the present participle from the sentence: I don't like frightening stories.",
    "options": [
      "don't",
      "like",
      "frightening",
      "stories"
    ],
    "ans": 2,
    "topic": "Participle",
    "explain": "'frightening' is derived from the verb 'frighten' + ING, used here as an adjective modifying 'stories'."
  },
  {
    "q": "Pick out the present participle from the following sentence: His eyes were shining.",
    "options": [
      "His",
      "eyes",
      "were",
      "shining"
    ],
    "ans": 3,
    "topic": "Participle",
    "explain": "'shining' = verb 'shine' + ING. Here it is used as part of the continuous verb 'were shining'."
  },
  {
    "q": "Identify the past participle in the given sentence: The broken chair is on the floor.",
    "options": [
      "broken",
      "chair",
      "is",
      "floor"
    ],
    "ans": 0,
    "topic": "Participle",
    "explain": "A past participle usually ends in -ed, -d, -t, -en, or -n. 'broken' acts as an adjective describing the 'chair'."
  },
  {
    "q": "Pick out the participle from the sentence: She heard the birds singing.",
    "options": [
      "She",
      "heard",
      "birds",
      "singing"
    ],
    "ans": 3,
    "topic": "Participle",
    "explain": "'singing' is a present participle describing the birds (acting as an adjective)."
  },
  {
    "q": "Identify the past participle in the sentence: She ate the cooked rice.",
    "options": [
      "She",
      "ate",
      "cooked",
      "rice"
    ],
    "ans": 2,
    "topic": "Participle",
    "explain": "'cooked' is the past participle used as an adjective to modify 'rice'."
  },
  {
    "q": "Identify the present participle in the sentence: The sleeping child looks sweet.",
    "options": [
      "sleeping",
      "child",
      "looks",
      "sweet"
    ],
    "ans": 0,
    "topic": "Participle",
    "explain": "'sleeping' is formed from sleep + ING and acts as an adjective describing the child."
  },
  {
    "q": "Which is the correct present participle of the verb 'run' following the doubling rule?",
    "options": [
      "runing",
      "runingg",
      "running",
      "raning"
    ],
    "ans": 2,
    "topic": "Doubling Rule",
    "explain": "Because 'run' has a short vowel followed by a single consonant, we double the last letter 'n' before adding -ING."
  },
  {
    "q": "Form a past participle in which the last letter is doubled for the base verb 'stop'.",
    "options": [
      "stoped",
      "stopping",
      "stopped",
      "stopt"
    ],
    "ans": 2,
    "topic": "Doubling Rule",
    "explain": "The base verb 'stop' ends in a single vowel + single consonant, so the 'p' is doubled before adding -ED."
  },
  {
    "q": "Which is the correctly formed present participle for the verb 'swim'?",
    "options": [
      "swiming",
      "swimming",
      "swamming",
      "swimmming"
    ],
    "ans": 1,
    "topic": "Doubling Rule",
    "explain": "We double the 'm' because 'swim' ends with a short vowel + single consonant."
  },
  {
    "q": "Form a past participle in which the last letter is doubled for the base verb 'plan'.",
    "options": [
      "planed",
      "planning",
      "plannned",
      "planned"
    ],
    "ans": 3,
    "topic": "Doubling Rule",
    "explain": "The base verb 'plan' ends in a single vowel + single consonant, so the 'n' is doubled."
  },
  {
    "q": "Why do we NOT double the last letter in the present participle 'eating'?",
    "options": [
      "It ends in a single vowel.",
      "It has a short vowel sound.",
      "It ends in a consonant cluster.",
      "It has two vowels (ea) before the final consonant."
    ],
    "ans": 3,
    "topic": "Doubling Rule",
    "explain": "Verbs like 'eat' or 'read' have two vowels before the final consonant, so the rule says do NOT double the last letter."
  },
  {
    "q": "Which of the following verbs requires doubling its last letter before adding -ING?",
    "options": [
      "sleep",
      "walk",
      "sit",
      "read"
    ],
    "ans": 2,
    "topic": "Doubling Rule",
    "explain": "'sit' has a short vowel followed by a single consonant, making it 'sitting'. The others have two vowels or a consonant cluster."
  },
  {
    "q": "Identify the verb in the given sentence and state whether it is finite or non-finite: He gave the reward to none.",
    "options": [
      "gave - Non-finite",
      "reward - Finite",
      "none - Non-finite",
      "gave - Finite"
    ],
    "ans": 3,
    "topic": "Finite vs Non-Finite",
    "explain": "'gave' changes with the subject and shows past tense (give \u2192 gave). Therefore, it is a FINITE verb."
  },
  {
    "q": "According to 'The Golden Test', what happens to a NON-FINITE verb when the subject changes from singular to plural?",
    "options": [
      "It changes its spelling.",
      "It stays exactly the same.",
      "It changes its tense.",
      "It moves to the end of the sentence."
    ],
    "ans": 1,
    "topic": "Finite vs Non-Finite",
    "explain": "If the verb does NOT change regardless of subject or tense, it is a NON-FINITE verb."
  },
  {
    "q": "In the sentence 'She wants to sleep', identify the finite verb.",
    "options": [
      "She",
      "wants",
      "to",
      "sleep"
    ],
    "ans": 1,
    "topic": "Finite vs Non-Finite",
    "explain": "'wants' is the finite verb because it changes according to the subject (e.g., They want). 'to sleep' is non-finite."
  },
  {
    "q": "Identify the non-finite verb in the sentence: They began to play.",
    "options": [
      "They",
      "began",
      "to play",
      "began to"
    ],
    "ans": 2,
    "topic": "Finite vs Non-Finite",
    "explain": "'to play' is an infinitive (non-finite) because it does not change if the subject or tense changes."
  },
  {
    "q": "In the sentence 'The boy was running fast', which part of the verb is FINITE?",
    "options": [
      "boy",
      "was",
      "running",
      "fast"
    ],
    "ans": 1,
    "topic": "Finite vs Non-Finite",
    "explain": "'was' is the finite verb because it reflects the singular subject and past tense. 'running' is a non-finite present participle."
  },
  {
    "q": "Is the word 'Reading' in the sentence 'Reading is good for us' a finite or non-finite verb?",
    "options": [
      "Finite, because it changes with the subject.",
      "Finite, because it ends in -ING.",
      "Non-finite, because it is an adjective.",
      "Non-finite, because it acts as a gerund and does not change with the subject or tense."
    ],
    "ans": 3,
    "topic": "Finite vs Non-Finite",
    "explain": "'Reading' is a gerund (acts as a noun) and is a type of non-finite verb. It does not change with the subject."
  }
];

    let currentQ = 0;
    let userAnswers = new Array(30).fill(null);
    let studentName = "";

    function startTimer() {
        timerInterval = setInterval(() => {
            timeRemaining--;
            sessionStorage.setItem('time_remaining', timeRemaining);
            updateTimerDisplay();
            if (timeRemaining <= 0) { 
                clearInterval(timerInterval); 
                submitExam(true); // Pass true because it's a forced auto-submit
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        document.getElementById('timer-display').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function startExam() {
        studentName = document.getElementById('student-name').value.trim();
        if (!studentName) return alert("Please enter your name");
        sessionStorage.setItem('name', studentName);
        sessionStorage.setItem('in_progress_' + EXAM_KEY, "true");
        document.getElementById('page-landing').classList.remove('active');
        document.getElementById('page-exam').classList.add('active');
        document.getElementById('exam-title-display').innerHTML = `<strong>Topic:</strong> ${EXAM_NAME}`;
        startTimer();
        renderGrid();
        showQuestion();
    }

    function renderGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = "";
        questions.forEach((_, i) => {
            const div = document.createElement('div');
            div.className = `nav-box ${i === currentQ ? 'current' : ''} ${userAnswers[i] !== null ? 'answered' : ''}`;
            div.innerText = i + 1;
            div.onclick = () => jumpTo(i);
            grid.appendChild(div);
        });
    }

    function showQuestion() {
        const q = questions[currentQ];
        document.getElementById('q-title').innerText = `Question ${currentQ + 1}`;
        document.getElementById('q-text').innerHTML = q.q;
        const optCont = document.getElementById('options-container');
        optCont.innerHTML = "";
        q.options.forEach((opt, idx) => {
            const lbl = document.createElement('label');
            lbl.className = "option-label";
            lbl.innerHTML = `<input type="radio" name="opt" ${userAnswers[currentQ] === idx ? 'checked' : ''} onchange="saveAns(${idx})"> ${opt}`;
            optCont.appendChild(lbl);
        });
        document.getElementById('next-btn').innerText = currentQ === questions.length - 1 ? "Finish" : "Next";
        sessionStorage.setItem('currentQ', currentQ);
        renderGrid();
    }

    function saveAns(idx) {
        userAnswers[currentQ] = idx;
        sessionStorage.setItem('answers', JSON.stringify(userAnswers));
        renderGrid();
    }

    function jumpTo(i) { currentQ = i; showQuestion(); }

    function changeQuestion(dir) {
        if (dir === 1 && currentQ === questions.length - 1) {
            submitExam(false); // Pass false because it is a manual submit attempt
        } else { 
            currentQ += dir; 
            showQuestion(); 
        }
    }

    async function submitExam(isAutoSubmit = false) {
        // Warning check for missing answers
        if (!isAutoSubmit) {
            const unansweredCount = userAnswers.filter(ans => ans === null).length;
            if (unansweredCount > 0) {
                const confirmSubmit = confirm(`You have left ${unansweredCount} question(s) unanswered. Are you sure you want to finish and submit?`);
                if (!confirmSubmit) return; // Stop submission if they click Cancel
            }
        }

        clearInterval(timerInterval);
        let score = 0;
        let topicMap = {};
        let reviewHTML = "";
        let missedQuestions = [];

        questions.forEach((q, i) => {
            const correct = userAnswers[i] === q.ans;
            if (correct) {
                score++;
            } else {
                missedQuestions.push("Q" + (i + 1));
            }
            if (!topicMap[q.topic]) topicMap[q.topic] = { total: 0, correct: 0, failedQ: [] };
            topicMap[q.topic].total++;
            if (correct) topicMap[q.topic].correct++;
            else topicMap[q.topic].failedQ.push(i + 1);

            reviewHTML += `<div class="review-card ${correct ? 'status-correct' : ''}">
                <strong>Q${i+1}:</strong> ${q.q}<br>
                Your Answer: <span style="color:${correct ? '#81c784' : '#ff5252'}">${userAnswers[i] !== null ? q.options[userAnswers[i]] : 'Skipped'}</span><br>
                Correct: ${q.options[q.ans]}<br>
                <em>Explanation: ${q.explain}</em></div>`;
        });

        const scoreStr = `${score}/${questions.length}`;
        let wrongAnswersString = missedQuestions.length > 0 ? missedQuestions.join(", ") : "None";

        document.getElementById('page-exam').classList.remove('active');
        document.getElementById('page-result').classList.add('active');
        document.getElementById('res-name').innerText = studentName;
        document.getElementById('final-score').innerText = scoreStr;
        document.getElementById('review-list').innerHTML = reviewHTML;

        let analysis = `<strong>AI Analysis Feedback (Question-Specific):</strong><br><br>`;
        for (let t in topicMap) {
            let pct = (topicMap[t].correct / topicMap[t].total) * 100;
            if (pct === 100) {
                analysis += `• Mastery achieved in ${t}. Your concepts are perfectly clear.<br>`;
            } else if (pct >= 60) {
                analysis += `• Strong foundation in ${t}, but minor errors occurred in Question(s) ${topicMap[t].failedQ.join(', ')}.<br>`;
            } else {
                analysis += `• Weak performance in ${t}. For example, in Question(s) ${topicMap[t].failedQ.join(', ')}, you failed to apply the rules correctly.<br>`;
            }
        }
        document.getElementById('ai-analysis').innerHTML = analysis;

        fetch(WEB_APP_URL, { 
            method: "POST", 
            mode: "no-cors", 
            body: JSON.stringify({ 
                studentName, 
                standard: HARDCODED_STD, 
                examName: EXAM_NAME, 
                subject: HARDCODED_SUBJECT,
                score: scoreStr, 
                wrongAnswers: wrongAnswersString 
            }) 
        });
        
        localStorage.setItem('submitted_data_' + EXAM_KEY, JSON.stringify({ name: studentName, answers: userAnswers, score: scoreStr, topicMap }));
        sessionStorage.clear();
        window.scrollTo(0, 0);
    }

    window.onload = () => {
        document.getElementById('exam-title-display').innerHTML = `<strong>Topic:</strong> ${EXAM_NAME}`;
        const saved = localStorage.getItem('submitted_data_' + EXAM_KEY);
        if (saved) {
            const data = JSON.parse(saved);
            studentName = data.name;
            userAnswers = data.answers;
            showResultsFromStorage(data);
        } else if (sessionStorage.getItem('in_progress_' + EXAM_KEY)) {
            studentName = sessionStorage.getItem('name');
            userAnswers = JSON.parse(sessionStorage.getItem('answers')) || userAnswers;
            currentQ = parseInt(sessionStorage.getItem('currentQ')) || 0;
            timeRemaining = parseInt(sessionStorage.getItem('time_remaining')) || 1800;
            document.getElementById('page-landing').classList.remove('active');
            document.getElementById('page-exam').classList.add('active');
            startTimer();
            updateTimerDisplay();
            renderGrid();
            showQuestion();
        }
    };

    function showResultsFromStorage(data) {
        document.getElementById('page-landing').classList.remove('active');
        document.getElementById('page-result').classList.add('active');
        document.getElementById('res-name').innerText = data.name;
        document.getElementById('final-score').innerText = data.score;
        let reviewHTML = "";
        questions.forEach((q, i) => {
            const correct = userAnswers[i] === q.ans;
            reviewHTML += `<div class="review-card ${correct ? 'status-correct' : ''}">
                <strong>Q${i+1}:</strong> ${q.q}<br>
                Your Answer: <span style="color:${correct ? '#81c784' : '#ff5252'}">${userAnswers[i] !== null ? q.options[userAnswers[i]] : 'Skipped'}</span><br>
                Correct: ${q.options[q.ans]}<br>
                <em>Explanation: ${q.explain}</em></div>`;
        });
        document.getElementById('review-list').innerHTML = reviewHTML;
        let analysis = `<strong>AI Analysis Feedback (Question-Specific):</strong><br><br>`;
        for (let t in data.topicMap) {
            let pct = (data.topicMap[t].correct / data.topicMap[t].total) * 100;
            if (pct === 100) {
                analysis += `• Mastery achieved in ${t}. Your concepts are perfectly clear.<br>`;
            } else if (pct >= 60) {
                analysis += `• Strong foundation in ${t}, but minor errors occurred in Question(s) ${data.topicMap[t].failedQ.join(', ')}.<br>`;
            } else {
                analysis += `• Weak performance in ${t}. For example, in Question(s) ${data.topicMap[t].failedQ.join(', ')}, you failed to apply the rules correctly.<br>`;
            }
        }
        document.getElementById('ai-analysis').innerHTML = analysis;
    }
</script>
