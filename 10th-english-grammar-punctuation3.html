<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright Minds Academy - 10th English Grammar</title>
    <style>
        /* Distinct Green Theme for English Grammar */
        :root { 
            --primary-bg: #173627; 
            --text-color: #ffffff; 
            --accent-color: #2bb872; 
            --error: #ff5252; 
            --correct: #81c784; 
            --answered: #ff9800; 
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--primary-bg); color: var(--text-color); margin: 0; padding: 10px; display: flex; justify-content: center; }
        #exam-container { width: 100%; max-width: 850px; background: rgba(255, 255, 255, 0.1); padding: 1.5rem; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .page { display: none; }
        .active { display: block; }
        #nav-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; margin-top: 20px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; }
        .nav-box { height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: #555; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .nav-box.current { background: var(--accent-color); border: 2px solid #fff; }
        .nav-box.answered { background: var(--answered); }
        .info-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; font-size: 0.9rem; }
        .header-main { text-align: center; border-bottom: 2px solid var(--accent-color); margin-bottom: 15px; padding-bottom: 10px; }
        #question-scroll-area { max-height: 60vh; overflow-y: auto; padding-right: 10px; margin-top: 10px; }
        .option-label { display: block; background: rgba(255,255,255,0.05); margin: 10px 0; padding: 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .option-label:hover { background: rgba(255,255,255,0.12); }
        input[type="radio"] { margin-right: 12px; transform: scale(1.2); }
        .btn-container { margin-top: 20px; display: flex; justify-content: space-between; }
        button { padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; background: var(--accent-color); color: white; font-weight: bold; }
        .review-card { background: rgba(0,0,0,0.3); padding: 15px; margin: 15px 0; border-radius: 8px; border-left: 5px solid var(--error); }
        .review-card.status-correct { border-left-color: var(--correct); }
    </style>
</head>
<body>

<div id="exam-container">
    <div id="page-landing" class="page active">
        <h1 class="header-main">Bright Minds Academy</h1>
        <div class="info-box" style="display: block;">
            <p><strong>Subject:</strong> English</p>
            <p id="exam-title-display"><strong>Topic:</strong> Loading...</p>
            <p><strong>Standard:</strong> 10th | <strong>Marks:</strong> 30 | <strong>Time:</strong> 30 Mins</p>
        </div>
        <div style="margin: 30px 0; text-align: center;">
            <input type="text" id="student-name" placeholder="Enter Full Student Name" style="width: 80%; padding: 12px; border-radius: 6px; border: none;">
        </div>
        <div style="text-align: center;"><button onclick="startExam()">Start Assignment</button></div>
    </div>

    <div id="page-exam" class="page">
        <div class="header-main" style="font-size: 1.2rem;">Bright Minds Academy</div>
        <div class="info-box">
            <span><strong>Time Left:</strong> <span id="timer-display">30:00</span></span>
            <span><strong>Marks:</strong> 30</span>
            <span><strong>Questions:</strong> 30</span>
        </div>
        <div id="question-scroll-area">
            <h3 id="q-title"></h3>
            <p id="q-text" style="font-size: 1.1rem; line-height: 1.6;"></p>
            <div id="options-container"></div>
        </div>
        <div class="btn-container">
            <button id="prev-btn" onclick="changeQuestion(-1)">Back</button>
            <button id="next-btn" onclick="changeQuestion(1)">Next</button>
        </div>
        <div id="nav-grid"></div>
    </div>

    <div id="page-result" class="page">
        <h2 id="res-name" style="text-align: center;"></h2>
        <h1 style="text-align: center;">Score: <span id="final-score"></span></h1>
        <div id="ai-analysis" style="background: rgba(76, 175, 80, 0.15); padding: 20px; border-radius: 10px; margin: 20px 0; line-height: 1.5;"></div>
        <h3>Question Review</h3>
        <div id="review-list"></div>
    </div>
</div>

<script>
    // UPDATE THESE FOR EACH NEW EXAM
    const EXAM_KEY = "10th_Eng_Grammar_punctuation3"; 
    const EXAM_NAME = "Punctuation & Error Correction test 3"; 
    
    // CONSTANTS
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwEutZaKIAodDqKVocXPmgGlsfyO6ma8vuQK4sFgEobmvD73QQwztuH4qbT_R3g1Figtw/exec";
    const HARDCODED_STD = "10th";
    const HARDCODED_SUBJECT = "English";
    
    let timerInterval;
    let timeRemaining = 1800; // 30 Minutes

    // JSON PAYLOAD GOES HERE (Paste the clean JSON array below this line)
    const questions = [
  { "q": "Choose the correctly punctuated sentence:<br><strong>will it rain today</strong>", "options": ["Will it rain today.", "will it rain today?", "Will it rain today?", "Will it rain today!"], "ans": 2, "topic": "Punctuation", "explain": "Questions must begin with a capital letter and end with a question mark." },
  { "q": "Choose the correctly punctuated sentence:<br><strong>surely you can guide us sir</strong>", "options": ["Surely you can guide us, sir.", "Surely you can guide us sir.", "surely you can guide us, sir.", "Surely, you can guide us sir."], "ans": 0, "topic": "Punctuation", "explain": "Start with a capital letter. Commas are used before addressing someone directly." },
  { "q": "Choose the correctly punctuated sentence:<br><strong>they will not surrender easily</strong>", "options": ["They will not surrender easily.", "they will not surrender easily.", "They will not surrender easily", "They will not surrender easily?"], "ans": 0, "topic": "Punctuation", "explain": "A basic statement requires a capital at the beginning and a full stop at the end." },
  { "q": "Choose the correctly punctuated sentence:<br><strong>mr sharma smiled at the students</strong>", "options": ["mr sharma smiled at the students.", "Mr Sharma smiled at the students.", "Mr. Sharma smiled at the students.", "Mr. sharma smiled at the students."], "ans": 2, "topic": "Punctuation", "explain": "Abbreviations ('Mr.') require a full stop. Proper nouns ('Sharma') must be capitalized." },
  { "q": "Choose the correctly punctuated sentence:<br><strong>moreover he doesnt care about it</strong>", "options": ["Moreover he doesn't care about it.", "Moreover, he doesnt care about it.", "Moreover, he doesn't care about it.", "moreover, he doesn't care about it."], "ans": 2, "topic": "Punctuation", "explain": "Use a capital letter, a comma after introductory words, an apostrophe in 'doesn't', and a full stop." },
  { "q": "Choose the correctly punctuated sentence:<br><strong>do you know the way he whispered</strong>", "options": ["\"Do you know the way.\" he whispered?", "\"Do you know the way?\" he whispered.", "Do you know the way? he whispered.", "\"do you know the way?\" he whispered."], "ans": 1, "topic": "Punctuation", "explain": "Inverted commas surround exact speech. The question mark replaces the comma inside the quotes." },
  { "q": "Choose the correctly punctuated sentence:<br><strong>you have never visited london she asked</strong>", "options": ["\"You have never visited london?\" she asked.", "\"You have never visited London?\" she asked.", "You have never visited London? she asked.", "\"You have never visited London,\" she asked."], "ans": 1, "topic": "Punctuation", "explain": "Proper noun 'London' must be capitalized. Question mark goes inside inverted commas." },
  { "q": "Choose the correctly punctuated sentence:<br><strong>the mother said clean your room</strong>", "options": ["The mother said, \"Clean your room.\"", "The mother said \"Clean your room.\"", "The mother said, \"clean your room.\"", "the mother said, \"Clean your room.\""], "ans": 0, "topic": "Punctuation", "explain": "Direct speech needs a comma after the reporting verb, inverted commas, and a capital letter inside." },
  { "q": "Choose the correctly punctuated sentence:<br><strong>what a tragic ending it was</strong>", "options": ["What a tragic ending it was.", "What a tragic ending it was?", "what a tragic ending it was!", "What a tragic ending it was!"], "ans": 3, "topic": "Punctuation", "explain": "Sentences showing strong emotion start with a capital and end with an exclamation mark." },
  { "q": "Choose the correctly punctuated sentence:<br><strong>the girl asked when is the train arriving</strong>", "options": ["The girl asked \"When is the train arriving?\"", "The girl asked, \"when is the train arriving?\"", "The girl asked, \"When is the train arriving?\"", "the girl asked, \"When is the train arriving?\""], "ans": 2, "topic": "Punctuation", "explain": "Comma before speech, inverted commas, capital 'When', and a question mark at the end." },
  { "q": "Choose the correctly punctuated sentence:<br><strong>pune is known as the oxford of the east</strong>", "options": ["Pune is known as the Oxford of the East.", "pune is known as the oxford of the east.", "Pune is known as the oxford of the east.", "Pune is known as the Oxford of the east!"], "ans": 0, "topic": "Punctuation", "explain": "Proper nouns and significant titles (Pune, Oxford, East) must be capitalized." },
  { "q": "Choose the correctly punctuated sentence:<br><strong>congratulations said the manager</strong>", "options": ["Congratulations, said the manager.", "\"Congratulations,\" said the manager.", "\"congratulations,\" said the manager.", "\"Congratulations\" said the manager."], "ans": 1, "topic": "Punctuation", "explain": "Spoken words need inverted commas. Use a comma to separate the speech from the speaker." },
  { "q": "Choose the correctly punctuated sentence:<br><strong>did he pass the final exam</strong>", "options": ["Did he pass the final exam.", "Did he pass the final exam?", "did he pass the final exam?", "Did he pass the final exam!"], "ans": 1, "topic": "Punctuation", "explain": "Questions start with a capital letter and end with a question mark." },
  { "q": "Choose the correctly punctuated sentence:<br><strong>mr rathod is a strict teacher</strong>", "options": ["Mr Rathod is a strict teacher.", "mr. Rathod is a strict teacher.", "Mr. Rathod is a strict teacher.", "Mr. rathod is a strict teacher."], "ans": 2, "topic": "Punctuation", "explain": "Abbreviations ('Mr.') get a full stop, and proper nouns ('Rathod') get capitals." },
  { "q": "Choose the correctly punctuated sentence:<br><strong>the stars shine brightly in the sky</strong>", "options": ["the stars shine brightly in the sky.", "The stars shine brightly in the sky", "The stars shine brightly in the sky.", "The stars shine brightly in the sky!"], "ans": 2, "topic": "Punctuation", "explain": "A basic statement requires a capital at the beginning and a full stop at the end." },
  { "q": "Spot the grammatical error and choose the correct sentence:<br><strong>It doesn't matters anymore.</strong>", "options": ["It don't matter anymore.", "It doesn't matter anymore.", "It didn't matters anymore.", "It not matter anymore."], "ans": 1, "topic": "Error Correction", "explain": "Wrong verb form. When using 'doesn't', the main verb must remain in its base form 'matter'." },
  { "q": "Spot the grammatical error and choose the correct sentence:<br><strong>They runs very fast to catch the bus.</strong>", "options": ["They running very fast to catch the bus.", "They ran very fast to catch the bus.", "They run very fast to catch the bus.", "They is run very fast to catch the bus."], "ans": 2, "topic": "Error Correction", "explain": "Subject-Verb Agreement error. The plural subject 'They' takes the plural verb 'run'." },
  { "q": "Spot the grammatical error and choose the correct sentence:<br><strong>All the bright students answers correctly.</strong>", "options": ["All the bright students answering correctly.", "All the bright students answer correctly.", "All the bright students answereds correctly.", "All the bright students is answer correctly."], "ans": 1, "topic": "Error Correction", "explain": "Subject-Verb Agreement error. 'students' is plural, requiring the plural verb 'answer'." },
  { "q": "Spot the grammatical error and choose the correct sentence:<br><strong>The house was building in 2010.</strong>", "options": ["The house was build in 2010.", "The house was built in 2010.", "The house is building in 2010.", "The house were built in 2010."], "ans": 1, "topic": "Error Correction", "explain": "Wrong verb form. Passive voice requires the past participle 'built'." },
  { "q": "Spot the grammatical error and choose the correct sentence:<br><strong>It don't make any sense.</strong>", "options": ["It doesn't make any sense.", "It didn't makes any sense.", "It don't makes any sense.", "It not make any sense."], "ans": 0, "topic": "Error Correction", "explain": "Subject-Verb Agreement error. The singular pronoun 'It' requires 'doesn't'." },
  { "q": "Spot the grammatical error and choose the correct sentence:<br><strong>The stars shines brightly at night.</strong>", "options": ["The stars shining brightly at night.", "The stars shine brightly at night.", "The star shine brightly at night.", "The stars is shine brightly at night."], "ans": 1, "topic": "Error Correction", "explain": "Subject-Verb Agreement error. The plural subject 'stars' takes the plural verb 'shine'." },
  { "q": "Spot the grammatical error and choose the correct sentence:<br><strong>The picture was drew by him.</strong>", "options": ["The picture was drawing by him.", "The picture was draw by him.", "The picture was drawn by him.", "The picture were drawn by him."], "ans": 2, "topic": "Error Correction", "explain": "Wrong verb form. Passive voice needs the past participle 'drawn', not 'drew'." },
  { "q": "Spot the grammatical error and choose the correct sentence:<br><strong>You is my best friend.</strong>", "options": ["You are my best friend.", "You am my best friend.", "You was my best friend.", "You be my best friend."], "ans": 0, "topic": "Error Correction", "explain": "Subject-Verb Agreement error. The pronoun 'You' always pairs with 'are'." },
  { "q": "Spot the grammatical error and choose the correct sentence:<br><strong>She was walk to the market.</strong>", "options": ["She is walk to the market.", "She was walking to the market.", "She were walking to the market.", "She walk to the market."], "ans": 1, "topic": "Error Correction", "explain": "Wrong verb form. The past continuous tense requires the 'ing' form 'walking'." },
  { "q": "Spot the grammatical error and choose the correct sentence:<br><strong>The river flow gently to the sea.</strong>", "options": ["The river flows gently to the sea.", "The river flowing gently to the sea.", "The river flown gently to the sea.", "The rivers flows gently to the sea."], "ans": 0, "topic": "Error Correction", "explain": "Subject-Verb Agreement error. Singular subject 'river' takes the singular verb 'flows'." },
  { "q": "Spot the grammatical error and choose the correct sentence:<br><strong>They was waiting for the train.</strong>", "options": ["They are wait for the train.", "They is waiting for the train.", "They were waiting for the train.", "They wait for the train."], "ans": 2, "topic": "Error Correction", "explain": "Subject-Verb Agreement error. The plural pronoun 'They' takes 'were'." },
  { "q": "Spot the grammatical error and choose the correct sentence:<br><strong>The match was winning by our team.</strong>", "options": ["The match was win by our team.", "The match was won by our team.", "The match is win by our team.", "The match were won by our team."], "ans": 1, "topic": "Error Correction", "explain": "Wrong verb form. Passive voice requires the past participle 'won'." },
  { "q": "Spot the grammatical error and choose the correct sentence:<br><strong>He don't have a pen.</strong>", "options": ["He doesn't have a pen.", "He didn't has a pen.", "He don't has a pen.", "He not have a pen."], "ans": 0, "topic": "Error Correction", "explain": "Subject-Verb Agreement error. The singular pronoun 'He' pairs with 'doesn't'." },
  { "q": "Spot the grammatical error and choose the correct sentence:<br><strong>The teacher write on the board.</strong>", "options": ["The teacher writes on the board.", "The teacher writing on the board.", "The teacher wrotes on the board.", "The teacher write on the board."], "ans": 0, "topic": "Error Correction", "explain": "Subject-Verb Agreement error. 'The teacher' is singular and requires the singular verb 'writes'." },
  { "q": "Spot the grammatical error and choose the correct sentence:<br><strong>The workers was tired after the long day.</strong>", "options": ["The workers is tired after the long day.", "The workers were tired after the long day.", "The worker were tired after the long day.", "The workers tiring after the long day."], "ans": 1, "topic": "Error Correction", "explain": "Subject-Verb Agreement error. The plural subject 'workers' takes 'were'." }
]  ;

    let currentQ = 0;
    let userAnswers = new Array(30).fill(null);
    let studentName = "";

    function startTimer() {
        timerInterval = setInterval(() => {
            timeRemaining--;
            sessionStorage.setItem('time_remaining', timeRemaining);
            updateTimerDisplay();
            if (timeRemaining <= 0) { 
                clearInterval(timerInterval); 
                submitExam(true); // Pass true because it's a forced auto-submit
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        document.getElementById('timer-display').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function startExam() {
        studentName = document.getElementById('student-name').value.trim();
        if (!studentName) return alert("Please enter your name");
        sessionStorage.setItem('name', studentName);
        sessionStorage.setItem('in_progress_' + EXAM_KEY, "true");
        document.getElementById('page-landing').classList.remove('active');
        document.getElementById('page-exam').classList.add('active');
        document.getElementById('exam-title-display').innerHTML = `<strong>Topic:</strong> ${EXAM_NAME}`;
        startTimer();
        renderGrid();
        showQuestion();
    }

    function renderGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = "";
        questions.forEach((_, i) => {
            const div = document.createElement('div');
            div.className = `nav-box ${i === currentQ ? 'current' : ''} ${userAnswers[i] !== null ? 'answered' : ''}`;
            div.innerText = i + 1;
            div.onclick = () => jumpTo(i);
            grid.appendChild(div);
        });
    }

    function showQuestion() {
        const q = questions[currentQ];
        document.getElementById('q-title').innerText = `Question ${currentQ + 1}`;
        document.getElementById('q-text').innerHTML = q.q;
        const optCont = document.getElementById('options-container');
        optCont.innerHTML = "";
        q.options.forEach((opt, idx) => {
            const lbl = document.createElement('label');
            lbl.className = "option-label";
            lbl.innerHTML = `<input type="radio" name="opt" ${userAnswers[currentQ] === idx ? 'checked' : ''} onchange="saveAns(${idx})"> ${opt}`;
            optCont.appendChild(lbl);
        });
        document.getElementById('next-btn').innerText = currentQ === questions.length - 1 ? "Finish" : "Next";
        sessionStorage.setItem('currentQ', currentQ);
        renderGrid();
    }

    function saveAns(idx) {
        userAnswers[currentQ] = idx;
        sessionStorage.setItem('answers', JSON.stringify(userAnswers));
        renderGrid();
    }

    function jumpTo(i) { currentQ = i; showQuestion(); }

    function changeQuestion(dir) {
        if (dir === 1 && currentQ === questions.length - 1) {
            submitExam(false); // Pass false because it is a manual submit attempt
        } else { 
            currentQ += dir; 
            showQuestion(); 
        }
    }

    async function submitExam(isAutoSubmit = false) {
        // Warning check for missing answers
        if (!isAutoSubmit) {
            const unansweredCount = userAnswers.filter(ans => ans === null).length;
            if (unansweredCount > 0) {
                const confirmSubmit = confirm(`You have left ${unansweredCount} question(s) unanswered. Are you sure you want to finish and submit?`);
                if (!confirmSubmit) return; // Stop submission if they click Cancel
            }
        }

        clearInterval(timerInterval);
        let score = 0;
        let topicMap = {};
        let reviewHTML = "";
        let missedQuestions = [];

        questions.forEach((q, i) => {
            const correct = userAnswers[i] === q.ans;
            if (correct) {
                score++;
            } else {
                missedQuestions.push("Q" + (i + 1));
            }
            if (!topicMap[q.topic]) topicMap[q.topic] = { total: 0, correct: 0, failedQ: [] };
            topicMap[q.topic].total++;
            if (correct) topicMap[q.topic].correct++;
            else topicMap[q.topic].failedQ.push(i + 1);

            reviewHTML += `<div class="review-card ${correct ? 'status-correct' : ''}">
                <strong>Q${i+1}:</strong> ${q.q}<br>
                Your Answer: <span style="color:${correct ? '#81c784' : '#ff5252'}">${userAnswers[i] !== null ? q.options[userAnswers[i]] : 'Skipped'}</span><br>
                Correct: ${q.options[q.ans]}<br>
                <em>Explanation: ${q.explain}</em></div>`;
        });

        const scoreStr = `${score}/${questions.length}`;
        let wrongAnswersString = missedQuestions.length > 0 ? missedQuestions.join(", ") : "None";

        document.getElementById('page-exam').classList.remove('active');
        document.getElementById('page-result').classList.add('active');
        document.getElementById('res-name').innerText = studentName;
        document.getElementById('final-score').innerText = scoreStr;
        document.getElementById('review-list').innerHTML = reviewHTML;

        let analysis = `<strong>AI Analysis Feedback (Question-Specific):</strong><br><br>`;
        for (let t in topicMap) {
            let pct = (topicMap[t].correct / topicMap[t].total) * 100;
            if (pct === 100) {
                analysis += `• Mastery achieved in ${t}. Your concepts are perfectly clear.<br>`;
            } else if (pct >= 60) {
                analysis += `• Strong foundation in ${t}, but minor errors occurred in Question(s) ${topicMap[t].failedQ.join(', ')}.<br>`;
            } else {
                analysis += `• Weak performance in ${t}. For example, in Question(s) ${topicMap[t].failedQ.join(', ')}, you failed to apply the rules correctly.<br>`;
            }
        }
        document.getElementById('ai-analysis').innerHTML = analysis;

        fetch(WEB_APP_URL, { 
            method: "POST", 
            mode: "no-cors", 
            body: JSON.stringify({ 
                studentName, 
                standard: HARDCODED_STD, 
                examName: EXAM_NAME, 
                subject: HARDCODED_SUBJECT,
                score: scoreStr, 
                wrongAnswers: wrongAnswersString 
            }) 
        });
        
        localStorage.setItem('submitted_data_' + EXAM_KEY, JSON.stringify({ name: studentName, answers: userAnswers, score: scoreStr, topicMap }));
        sessionStorage.clear();
        window.scrollTo(0, 0);
    }

    window.onload = () => {
        document.getElementById('exam-title-display').innerHTML = `<strong>Topic:</strong> ${EXAM_NAME}`;
        const saved = localStorage.getItem('submitted_data_' + EXAM_KEY);
        if (saved) {
            const data = JSON.parse(saved);
            studentName = data.name;
            userAnswers = data.answers;
            showResultsFromStorage(data);
        } else if (sessionStorage.getItem('in_progress_' + EXAM_KEY)) {
            studentName = sessionStorage.getItem('name');
            userAnswers = JSON.parse(sessionStorage.getItem('answers')) || userAnswers;
            currentQ = parseInt(sessionStorage.getItem('currentQ')) || 0;
            timeRemaining = parseInt(sessionStorage.getItem('time_remaining')) || 1800;
            document.getElementById('page-landing').classList.remove('active');
            document.getElementById('page-exam').classList.add('active');
            startTimer();
            updateTimerDisplay();
            renderGrid();
            showQuestion();
        }
    };

    function showResultsFromStorage(data) {
        document.getElementById('page-landing').classList.remove('active');
        document.getElementById('page-result').classList.add('active');
        document.getElementById('res-name').innerText = data.name;
        document.getElementById('final-score').innerText = data.score;
        let reviewHTML = "";
        questions.forEach((q, i) => {
            const correct = userAnswers[i] === q.ans;
            reviewHTML += `<div class="review-card ${correct ? 'status-correct' : ''}">
                <strong>Q${i+1}:</strong> ${q.q}<br>
                Your Answer: <span style="color:${correct ? '#81c784' : '#ff5252'}">${userAnswers[i] !== null ? q.options[userAnswers[i]] : 'Skipped'}</span><br>
                Correct: ${q.options[q.ans]}<br>
                <em>Explanation: ${q.explain}</em></div>`;
        });
        document.getElementById('review-list').innerHTML = reviewHTML;
        let analysis = `<strong>AI Analysis Feedback (Question-Specific):</strong><br><br>`;
        for (let t in data.topicMap) {
            let pct = (data.topicMap[t].correct / data.topicMap[t].total) * 100;
            if (pct === 100) {
                analysis += `• Mastery achieved in ${t}. Your concepts are perfectly clear.<br>`;
            } else if (pct >= 60) {
                analysis += `• Strong foundation in ${t}, but minor errors occurred in Question(s) ${data.topicMap[t].failedQ.join(', ')}.<br>`;
            } else {
                analysis += `• Weak performance in ${t}. For example, in Question(s) ${data.topicMap[t].failedQ.join(', ')}, you failed to apply the rules correctly.<br>`;
            }
        }
        document.getElementById('ai-analysis').innerHTML = analysis;
    }
</script>
</body>
</html>
