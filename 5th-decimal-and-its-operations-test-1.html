<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5th Maths Olympiad - Master Template</title>
    
    <script>
      MathJax = {
        tex: { inlineMath: [['$', '$']] }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        /* Faint Orange Theme for 5th Maths Olympiad */
        :root { 
            --primary-bg: #4a3521; 
            --text-color: #ffffff; 
            --accent-color: #e67e22; /* Faint Orange */
            --error: #ff5252; 
            --correct: #81c784; 
            --answered: #ff9800; 
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--primary-bg); color: var(--text-color); margin: 0; padding: 10px; display: flex; justify-content: center; }
        #exam-container { width: 100%; max-width: 850px; background: rgba(255, 255, 255, 0.1); padding: 1.5rem; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .page { display: none; }
        .active { display: block; }
        #nav-grid { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 12px; 
            margin-top: 20px; 
            background: rgba(0,0,0,0.2); 
            padding: 15px; 
            border-radius: 8px; 
        }
        .nav-box { 
            width: 35px; 
            height: 35px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 50%; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.9rem; 
            transition: all 0.3s ease; 
        }
        .nav-box.current { 
            background: var(--accent-color); 
            border: 2px solid #fff; 
            box-shadow: 0 0 10px var(--accent-color), 0 0 20px var(--accent-color); 
            color: #fff; 
        }
        .nav-box.answered { 
            background: var(--answered); 
            border: 2px solid #fff;
            box-shadow: 0 0 8px var(--answered), 0 0 15px var(--answered); 
            color: #fff;
        }
        .info-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; font-size: 0.9rem; }
        .header-main { text-align: center; border-bottom: 2px solid var(--accent-color); margin-bottom: 15px; padding-bottom: 10px; }
        #question-scroll-area { max-height: 60vh; overflow-y: auto; padding-right: 10px; margin-top: 10px; }
        .option-label { display: flex; align-items: center; background: rgba(255,255,255,0.05); margin: 10px 0; padding: 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .option-label:hover { background: rgba(255,255,255,0.12); }
        input[type="radio"] { margin-right: 15px; transform: scale(1.2); }
        .btn-container { margin-top: 20px; display: flex; justify-content: space-between; }
        button { padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; background: var(--accent-color); color: white; font-weight: bold; }
        .review-card { background: rgba(0,0,0,0.3); padding: 15px; margin: 15px 0; border-radius: 8px; border-left: 5px solid var(--error); }
        .review-card.status-correct { border-left-color: var(--correct); }
    </style>
</head>
<body>

<div id="exam-container">
    <div id="page-landing" class="page active">
        <h1 class="header-main">5th Maths Olympiad</h1>
        <div class="info-box" style="display: block;">
            <p><strong>Subject:</strong> <span id="display-subject">Maths</span></p>
            <p id="exam-title-display"><strong>Topic:</strong> Loading...</p>
            <p><strong>Standard:</strong> <span id="display-std">5th</span> | <strong>Marks:</strong> <span id="display-total-marks">20</span> | <strong>Time:</strong> <span id="display-total-time">30</span> Mins</p>
        </div>
        <div style="margin: 30px 0; text-align: center;">
            <input type="text" id="student-name" placeholder="Enter Full Student Name" style="width: 80%; padding: 12px; border-radius: 6px; border: none;">
        </div>
        <div style="text-align: center;"><button onclick="startExam()">Start Assignment</button></div>
    </div>

    <div id="page-exam" class="page">
        <div class="header-main" style="font-size: 1.2rem;">5th Maths Olympiad</div>
        <div class="info-box">
            <span><strong>Time Left:</strong> <span id="timer-display">Loading...</span></span>
            <span><strong>Marks:</strong> <span id="exam-marks-display">20</span></span>
            <span><strong>Questions:</strong> <span id="exam-questions-display">20</span></span>
        </div>
        <div id="question-scroll-area">
            <h3 id="q-title"></h3>
            <p id="q-text" style="font-size: 1.1rem; line-height: 1.6;"></p>
            <div id="options-container"></div>
        </div>
        <div class="btn-container">
            <button id="prev-btn" onclick="changeQuestion(-1)">Back</button>
            <button id="next-btn" onclick="changeQuestion(1)">Next</button>
        </div>
        <div id="nav-grid"></div>
    </div>

    <div id="page-result" class="page">
        <h2 id="res-name" style="text-align: center;"></h2>
        <h1 style="text-align: center;">Score: <span id="final-score"></span></h1>
        <div id="ai-analysis" style="background: rgba(230, 126, 34, 0.15); padding: 20px; border-radius: 10px; margin: 20px 0; line-height: 1.5;"></div>
        <h3>Question Review</h3>
        <div id="review-list"></div>
    </div>
</div>

<script>
    // ==========================================
    // 1. UPDATE THESE VARIABLES FOR EVERY NEW EXAM
    // ==========================================
    const EXAM_KEY = "5th-olympiad-decimals-and-operations-test-1"; // Must be unique so localStorage doesn't overlap
    const EXAM_NAME = "Decimal and it's Operations Test 1"; 
    
    const HARDCODED_STD = "5th";
    const HARDCODED_SUBJECT = "Maths";
    
    let timeRemaining = 1800; // Time in seconds (e.g., 1800 = 30 Minutes)

    // ==========================================
    // 2. PASTE JSON QUESTION DATA HERE
    // ==========================================
    const questions = [
  {
    "q": "Find the product of 5487.476 and 1000.",
    "options": ["54874.76", "548747.6", "5487476", "548.7476"],
    "ans": 2,
    "topic": "Multiplication of Decimals by Power of 10",
    "explain": "To multiply a decimal by a power of 10, shift the decimal point to the right as many places as there are zeroes. 1000 has 3 zeroes, so shift 3 places right: 5487.476 becomes 5487476."
  },
  {
    "q": "Divide 2345.63 by 1000.",
    "options": ["23.4563", "2.34563", "0.234563", "234.563"],
    "ans": 1,
    "topic": "Division of a Decimal by the Power of 10",
    "explain": "To divide a decimal by a power of 10, shift the point to the left as many places as there are zeroes. 1000 has 3 zeroes, so shift 3 places left: 2345.63 becomes 2.34563."
  },
  {
    "q": "Find the product of 2.3 and 100000.",
    "options": ["23000", "230000", "2300000", "2300"],
    "ans": 1,
    "topic": "Multiplication of Decimals by Power of 10",
    "explain": "Shift the decimal point 5 places to the right because 100000 has 5 zeroes. Since there is only one digit right of the point, add four zeroes: 2.3 becomes 230000."
  },
  {
    "q": "Divide 0.23 by 10000.",
    "options": ["0.00023", "0.000023", "0.0023", "0.0000023"],
    "ans": 1,
    "topic": "Division of a Decimal by the Power of 10",
    "explain": "Shift the decimal point 4 places to the left. Add zeroes to the left of the digits if short of places: 0.23 becomes 0.000023."
  },
  {
    "q": "What is the result when 45.02 is multiplied by 100 and then divided by 1000?",
    "options": ["4.502", "45.02", "0.4502", "450.2"],
    "ans": 0,
    "topic": "Multiplication and Division by Powers of 10",
    "explain": "First multiply by 100 (shift 2 places right): 45.02 becomes 4502. Then divide by 1000 (shift 3 places left): 4502 becomes 4.502."
  },
  {
    "q": "A and B are two decimals. If the integral part of A is greater than that of B, then:",
    "options": ["A > B", "A < B", "A = B", "All of these"],
    "ans": 0,
    "topic": "Comparison of Decimals",
    "explain": "When comparing decimals, we first check the integral parts. The decimal having the greater integral part is strictly greater. Therefore, A > B."
  },
  {
    "q": "There are 4562 wheat bags in a godown. If each bag contains 45.6 kg of wheat, find the total amount of wheat in the godown.",
    "options": ["208027.20 kg", "20802.72 kg", "2080.272 kg", "208.0272 kg"],
    "ans": 0,
    "topic": "Multiplication of Decimals",
    "explain": "Total amount of wheat = Number of bags multiplied by the weight per bag. 4562 multiplied by 45.6 equals 208027.20 kg."
  },
  {
    "q": "Find the number which is 4.2456 less than the product of 45.21 and 9.76.",
    "options": ["437.004", "443.4952", "447.7408", "451.9864"],
    "ans": 0,
    "topic": "Operations on Decimals",
    "explain": "First, find the product: 45.21 multiplied by 9.76 equals 441.2496. Then, subtract the given value: 441.2496 - 4.2456 = 437.0040."
  },
  {
    "q": "Write the decimal part of the decimal which is 345.23 less than the sum of the decimal 675.03 and 5.9632.",
    "options": ["7632", "8236", "07632", "70632"],
    "ans": 0,
    "topic": "Addition and Subtraction of Decimals",
    "explain": "Sum = 675.03 + 5.9632 = 680.9932. Subtract 345.23 to get 335.7632. The decimal part alone is 7632."
  },
  {
    "q": "Jack selected two decimals 35.41 and 4.5 and multiplied them. The product is 8.1443. After a while he realized that he mistakenly multiplied 35.41 by another decimal instead of 4.5. Find the other decimal.",
    "options": ["2.3", "0.23", "0.023", "0.0023"],
    "ans": 1,
    "topic": "Multiplication of Decimals",
    "explain": "To find the mistakenly used decimal, divide the incorrect product by the first number: 8.1443 divided by 35.41 equals 0.23."
  },
  {
    "q": "Find the decimal places of the decimal which is 456.3215 more than 3565.964.",
    "options": ["One", "Two", "Three", "Four"],
    "ans": 3,
    "topic": "Decimal Places",
    "explain": "Convert to like decimals and add: 456.3215 + 3565.9640 = 4022.2855. There are four digits to the right of the point, so it has four decimal places."
  },
  {
    "q": "A piece of ribbon 18.75 meters long is cut into equal smaller pieces of length 1.25 meters each. How many cuts are required to divide the ribbon?",
    "options": ["14 cuts", "15 cuts", "16 cuts", "13 cuts"],
    "ans": 0,
    "topic": "Logical Deduction with Decimals",
    "explain": "First, find the number of pieces: 18.75 divided by 1.25 equals 15 pieces. To get 15 pieces from a single ribbon, you need 1 less cut than the number of pieces, so 15 - 1 = 14 cuts."
  },
  {
    "q": "A recipe requires 0.45 liters of milk for 2.5 dozen cookies. How many liters of milk are needed to bake 7.5 dozen cookies?",
    "options": ["1.15 liters", "1.35 liters", "1.45 liters", "1.25 liters"],
    "ans": 1,
    "topic": "Proportions with Decimals",
    "explain": "Find the scaling factor by dividing the target amount by the original amount: 7.5 divided by 2.5 equals 3. Multiply the original milk volume by this factor: 0.45 multiplied by 3 equals 1.35 liters."
  },
  {
    "q": "A water tank initially holds 500.5 liters of water. On Monday, 125.75 liters are drained. On Tuesday, 85.5 liters are pumped back in. On Wednesday, 210.25 liters are drained. How much water is left in the tank?",
    "options": ["250.0 liters", "240.25 liters", "260.5 liters", "245.0 liters"],
    "ans": 0,
    "topic": "Multi-step Decimal Operations",
    "explain": "500.5 - 125.75 = 374.75 liters. 374.75 + 85.5 = 460.25 liters. 460.25 - 210.25 = 250.0 liters."
  },
  {
    "q": "A merchant buys 12.5 kg of coffee beans for 350.50 rupees. He sells all the beans at 32.40 rupees per kg. What is his total profit or loss?",
    "options": ["Profit of 54.50 rupees", "Loss of 54.50 rupees", "Profit of 44.50 rupees", "Loss of 44.50 rupees"],
    "ans": 0,
    "topic": "Money and Decimals",
    "explain": "Total revenue = 12.5 multiplied by 32.40 = 405.00 rupees. Profit = Revenue - Cost = 405.00 - 350.50 = 54.50 rupees profit."
  },
  {
    "q": "When a decimal M is converted to a fraction, it simplifies to $\\frac{137}{8}$. What is the value of M added to 2.125?",
    "options": ["18.25", "19.25", "20.125", "17.125"],
    "ans": 1,
    "topic": "Fractions and Decimals",
    "explain": "First, convert the fraction back to a decimal: 137 divided by 8 equals 17.125. Then add 2.125: 17.125 + 2.125 = 19.25."
  },
  {
    "q": "The sum of three decimals is 150.25. The first decimal is 45.6. The second decimal is 12.35 greater than the first. What is the value of the third decimal?",
    "options": ["46.7", "47.7", "57.95", "45.6"],
    "ans": 0,
    "topic": "Algebraic Decimals",
    "explain": "Second decimal = 45.6 + 12.35 = 57.95. Sum of first two = 45.6 + 57.95 = 103.55. Third decimal = 150.25 - 103.55 = 46.7."
  },
  {
    "q": "A marathon runner covers 26.25 km at a constant speed in 2.5 hours. What is her speed in km/h?",
    "options": ["10.2 km/h", "11.5 km/h", "10.5 km/h", "12.0 km/h"],
    "ans": 2,
    "topic": "Speed, Distance, Time with Decimals",
    "explain": "Speed = Distance divided by Time. 26.25 divided by 2.5 equals 10.5 km/h."
  },
  {
    "q": "A rectangular field has a length of 24.5 meters and a width of 15.2 meters. What is the exact area of the field in square meters?",
    "options": ["371.4", "372.4", "362.4", "382.4"],
    "ans": 1,
    "topic": "Geometry and Decimals",
    "explain": "Area = length multiplied by width. 24.5 multiplied by 15.2 equals 372.4 square meters."
  },
  {
    "q": "A snail climbs up a 12.5 meter wall. Every hour it climbs 2.5 meters upward, but slides back down 0.75 meters. How much effective distance does it cover in 4 hours?",
    "options": ["10 meters", "8 meters", "7 meters", "6.5 meters"],
    "ans": 2,
    "topic": "Word Problems with Decimals",
    "explain": "Effective distance covered per hour = 2.5 - 0.75 = 1.75 meters. In 4 hours, it covers 1.75 multiplied by 4 equals 7.0 meters."
  }
];

    // ==========================================
    // DO NOT CHANGE ANYTHING BELOW THIS LINE
    // ==========================================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwEutZaKIAodDqKVocXPmgGlsfyO6ma8vuQK4sFgEobmvD73QQwztuH4qbT_R3g1Figtw/exec";
    
    let timerInterval;
    let currentQ = 0;
    let userAnswers = []; 
    let studentName = "";

    function startTimer() {
        timerInterval = setInterval(() => {
            timeRemaining--;
            sessionStorage.setItem('time_remaining', timeRemaining);
            updateTimerDisplay();
            if (timeRemaining <= 0) { 
                clearInterval(timerInterval); 
                submitExam(true); 
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        document.getElementById('timer-display').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function startExam() {
        studentName = document.getElementById('student-name').value.trim();
        if (!studentName) return alert("Please enter your name");
        sessionStorage.setItem('name', studentName);
        sessionStorage.setItem('in_progress_' + EXAM_KEY, "true");
        document.getElementById('page-landing').classList.remove('active');
        document.getElementById('page-exam').classList.add('active');
        startTimer();
        renderGrid();
        showQuestion();
    }

    function renderGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = "";
        questions.forEach((_, i) => {
            const div = document.createElement('div');
            div.className = `nav-box ${i === currentQ ? 'current' : ''} ${userAnswers[i] !== null ? 'answered' : ''}`;
            div.innerText = i + 1;
            div.onclick = () => jumpTo(i);
            grid.appendChild(div);
        });
    }

    function showQuestion() {
        const q = questions[currentQ];
        document.getElementById('q-title').innerText = `Question ${currentQ + 1}`;
        document.getElementById('q-text').innerHTML = q.q;
        const optCont = document.getElementById('options-container');
        optCont.innerHTML = "";
        q.options.forEach((opt, idx) => {
            const lbl = document.createElement('label');
            lbl.className = "option-label";
            lbl.innerHTML = `<input type="radio" name="opt" ${userAnswers[currentQ] === idx ? 'checked' : ''} onchange="saveAns(${idx})"> <div>${opt}</div>`;
            optCont.appendChild(lbl);
        });
        document.getElementById('next-btn').innerText = currentQ === questions.length - 1 ? "Finish" : "Next";
        sessionStorage.setItem('currentQ', currentQ);
        renderGrid();
        
        // Tells MathJax to render the newly injected LaTeX formulas
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function saveAns(idx) {
        userAnswers[currentQ] = idx;
        sessionStorage.setItem('answers', JSON.stringify(userAnswers));
        renderGrid();
    }

    function jumpTo(i) { currentQ = i; showQuestion(); }

    function changeQuestion(dir) {
        if (dir === 1 && currentQ === questions.length - 1) {
            submitExam(false); 
        } else { 
            currentQ += dir; 
            showQuestion(); 
        }
    }

    async function submitExam(isAutoSubmit = false) {
        if (!isAutoSubmit) {
            const unansweredCount = userAnswers.filter(ans => ans === null).length;
            if (unansweredCount > 0) {
                const confirmSubmit = confirm(`You have left ${unansweredCount} question(s) unanswered. Are you sure you want to finish and submit?`);
                if (!confirmSubmit) return; 
            }
        }

        clearInterval(timerInterval);
        let score = 0;
        let topicMap = {};
        let reviewHTML = "";
        let missedQuestions = [];

        questions.forEach((q, i) => {
            const correct = userAnswers[i] === q.ans;
            if (correct) {
                score++;
            } else {
                missedQuestions.push("Q" + (i + 1));
            }
            if (!topicMap[q.topic]) topicMap[q.topic] = { total: 0, correct: 0, failedQ: [] };
            topicMap[q.topic].total++;
            if (correct) topicMap[q.topic].correct++;
            else topicMap[q.topic].failedQ.push(i + 1);

            reviewHTML += `<div class="review-card ${correct ? 'status-correct' : ''}">
                <strong>Q${i+1}:</strong> ${q.q}<br>
                Your Answer: <span style="color:${correct ? '#81c784' : '#ff5252'}">${userAnswers[i] !== null ? q.options[userAnswers[i]] : 'Skipped'}</span><br>
                Correct: ${q.options[q.ans]}<br>
                <em>Explanation: ${q.explain}</em></div>`;
        });

        const scoreStr = `${score}/${questions.length}`;
        let wrongAnswersString = missedQuestions.length > 0 ? missedQuestions.join(", ") : "None";

        document.getElementById('page-exam').classList.remove('active');
        document.getElementById('page-result').classList.add('active');
        document.getElementById('res-name').innerText = studentName;
        document.getElementById('final-score').innerText = scoreStr;
        document.getElementById('review-list').innerHTML = reviewHTML;

        let analysis = `<strong>AI Analysis Feedback (Question-Specific):</strong><br><br>`;
        for (let t in topicMap) {
            let pct = (topicMap[t].correct / topicMap[t].total) * 100;
            if (pct === 100) {
                analysis += `• Mastery achieved in ${t}. Your concepts are perfectly clear.<br>`;
            } else if (pct >= 60) {
                analysis += `• Strong foundation in ${t}, but minor errors occurred in Question(s) ${topicMap[t].failedQ.join(', ')}.<br>`;
            } else {
                analysis += `• Weak performance in ${t}. For example, in Question(s) ${topicMap[t].failedQ.join(', ')}, you failed to apply the rules correctly.<br>`;
            }
        }
        document.getElementById('ai-analysis').innerHTML = analysis;

        // Render MathJax in the review section
        if (window.MathJax) {
            MathJax.typesetPromise();
        }

        fetch(WEB_APP_URL, { 
            method: "POST", 
            mode: "no-cors", 
            body: JSON.stringify({ 
                studentName, 
                standard: HARDCODED_STD, 
                examName: EXAM_NAME, 
                subject: HARDCODED_SUBJECT,
                score: scoreStr, 
                wrongAnswers: wrongAnswersString 
            }) 
        });
        
        localStorage.setItem('submitted_data_' + EXAM_KEY, JSON.stringify({ name: studentName, answers: userAnswers, score: scoreStr, topicMap }));
        sessionStorage.clear();
        window.scrollTo(0, 0);
    }

    window.onload = () => {
        // Initialize dynamic UI elements based on variables
        userAnswers = new Array(questions.length).fill(null);
        document.getElementById('exam-title-display').innerHTML = `<strong>Topic:</strong> ${EXAM_NAME}`;
        document.getElementById('display-subject').innerText = HARDCODED_SUBJECT;
        document.getElementById('display-std').innerText = HARDCODED_STD;
        document.getElementById('display-total-marks').innerText = questions.length;
        document.getElementById('exam-marks-display').innerText = questions.length;
        document.getElementById('exam-questions-display').innerText = questions.length;
        document.getElementById('display-total-time').innerText = Math.floor(timeRemaining / 60);

        const saved = localStorage.getItem('submitted_data_' + EXAM_KEY);
        if (saved) {
            const data = JSON.parse(saved);
            studentName = data.name;
            userAnswers = data.answers;
            showResultsFromStorage(data);
        } else if (sessionStorage.getItem('in_progress_' + EXAM_KEY)) {
            studentName = sessionStorage.getItem('name');
            userAnswers = JSON.parse(sessionStorage.getItem('answers')) || userAnswers;
            currentQ = parseInt(sessionStorage.getItem('currentQ')) || 0;
            timeRemaining = parseInt(sessionStorage.getItem('time_remaining')) || timeRemaining;
            document.getElementById('page-landing').classList.remove('active');
            document.getElementById('page-exam').classList.add('active');
            startTimer();
            updateTimerDisplay();
            renderGrid();
            showQuestion();
        } else {
            updateTimerDisplay();
        }
    };

    function showResultsFromStorage(data) {
        document.getElementById('page-landing').classList.remove('active');
        document.getElementById('page-result').classList.add('active');
        document.getElementById('res-name').innerText = data.name;
        document.getElementById('final-score').innerText = data.score;
        let reviewHTML = "";
        questions.forEach((q, i) => {
            const correct = userAnswers[i] === q.ans;
            reviewHTML += `<div class="review-card ${correct ? 'status-correct' : ''}">
                <strong>Q${i+1}:</strong> ${q.q}<br>
                Your Answer: <span style="color:${correct ? '#81c784' : '#ff5252'}">${userAnswers[i] !== null ? q.options[userAnswers[i]] : 'Skipped'}</span><br>
                Correct: ${q.options[q.ans]}<br>
                <em>Explanation: ${q.explain}</em></div>`;
        });
        document.getElementById('review-list').innerHTML = reviewHTML;
        let analysis = `<strong>AI Analysis Feedback (Question-Specific):</strong><br><br>`;
        for (let t in data.topicMap) {
            let pct = (data.topicMap[t].correct / data.topicMap[t].total) * 100;
            if (pct === 100) {
                analysis += `• Mastery achieved in ${t}. Your concepts are perfectly clear.<br>`;
            } else if (pct >= 60) {
                analysis += `• Strong foundation in ${t}, but minor errors occurred in Question(s) ${data.topicMap[t].failedQ.join(', ')}.<br>`;
            } else {
                analysis += `• Weak performance in ${t}. For example, in Question(s) ${data.topicMap[t].failedQ.join(', ')}, you failed to apply the rules correctly.<br>`;
            }
        }
        document.getElementById('ai-analysis').innerHTML = analysis;
