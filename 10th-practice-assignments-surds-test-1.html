<head>

    <style>
        :root {
            --primary-bg: #1e3a2f;
            --card-bg: rgba(255, 255, 255, 0.08);
            --text-color: #ffffff;
            --accent-color: #2ecc71;
            --error: #ff5252;
            --correct: #81c784;
            --answered: #ff9800;
 
            /* Neon circle colors */
            --neon-default: #555e58;
            --neon-current-color: #00ffae;
            --neon-answered-color: #ff9800;
            --neon-glow-current: 0 0 8px #00ffae, 0 0 18px #00ffae, 0 0 32px #00ffae88;
            --neon-glow-answered: 0 0 8px #ff9800, 0 0 18px #ff9800, 0 0 28px #ff980066;
        }
 
        * { box-sizing: border-box; margin: 0; padding: 0; }
 
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--primary-bg);
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(46,204,113,0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(0,255,174,0.05) 0%, transparent 55%);

            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 14px 10px 30px;
        }
 
        #exam-container {
            width: 100%;
            max-width: 860px;
            background: rgba(255,255,255,0.07);
            padding: 1.6rem;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
            border: 1px solid rgba(46,204,113,0.15);
        }
 
        .page { display: none; }
        .active { display: block; }
 
        /* ── Header ── */
        .header-main {
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
            margin-bottom: 18px;
            padding-bottom: 12px;
            letter-spacing: 0.5px;
        }
        .header-main h1, .header-main span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
        }
 
        /* ── Info Box ── */
        .info-box {
            background: rgba(0,0,0,0.25);
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            font-size: 0.88rem;
            text-align: center;
            border: 1px solid rgba(46,204,113,0.12);
        }
        .info-box span { line-height: 1.6; }
 
        /* ── Landing Hero Card ── */
        .hero-card {
            text-align: center;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(46,204,113,0.3);
            border-radius: 16px;
            padding: 36px 28px 30px;
            margin-bottom: 28px;
            box-shadow: 0 0 40px rgba(46,204,113,0.08), inset 0 1px 0 rgba(255,255,255,0.06);
            position: relative;
            overflow: hidden;
        }
        .hero-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
        }
        .hero-exam-label {
            font-size: 0.75rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--accent-color);
            opacity: 0.75;
            margin-bottom: 10px;
        }
        .hero-exam-name {
            font-size: 1.9rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.25;
            margin-bottom: 22px;
            text-shadow: 0 0 20px rgba(46,204,113,0.25);
        }
        .hero-meta {
            display: flex;
            justify-content: center;
            gap: 0;
            flex-wrap: wrap;
        }
        .hero-meta-item {
            padding: 8px 22px;
            border-right: 1px solid rgba(255,255,255,0.12);
            font-size: 0.9rem;
            color: rgba(255,255,255,0.65);
        }
        .hero-meta-item:last-child { border-right: none; }
        .hero-meta-item strong { color: #ffffff; display: block; font-size: 1.05rem; margin-bottom: 2px; }
 
        .name-input-wrap {
            margin: 32px 0;
            text-align: center;
        }
        #student-name {
            width: 80%;
            padding: 13px 16px;
            border-radius: 8px;
            border: 2px solid rgba(46,204,113,0.4);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        #student-name:focus { border-color: var(--accent-color); }
        #student-name::placeholder { color: rgba(255,255,255,0.4); }
 
        /* ── Buttons ── */
        .btn-container { margin-top: 22px; display: flex; justify-content: space-between; }
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: var(--accent-color);
            color: #0d2318;
            font-weight: 700;
            font-size: 0.95rem;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 0 10px rgba(46,204,113,0.35);
        }

        /* ── Question area ── */
        #question-scroll-area {
            max-height: 58vh;
            overflow-y: auto;
            padding-right: 8px;
            margin-top: 12px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-color) transparent;
        }
        #question-scroll-area::-webkit-scrollbar { width: 5px; }
        #question-scroll-area::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 4px; }
 
        #q-title { font-size: 0.82rem; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
        #q-text { font-size: 1.05rem; line-height: 1.75; margin-bottom: 14px; }
 
        .option-label {
            display: block;
            background: rgba(255,255,255,0.05);
            margin: 10px 0;
            padding: 14px 16px;
            border-radius: 9px;
            cursor: pointer;
            transition: background 0.18s, border-color 0.18s;
            border: 1px solid transparent;
        }
        .option-label:hover { background: rgba(46,204,113,0.12); border-color: rgba(46,204,113,0.3); }
        .option-label.selected { background: rgba(46,204,113,0.18); border-color: var(--accent-color); }
        input[type="radio"] { margin-right: 12px; transform: scale(1.2); accent-color: var(--accent-color); }
 
        /* ── Neon Navigation Grid ── */
        #nav-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
            background: rgba(0,0,0,0.2);
            padding: 16px;
            border-radius: 10px;
            justify-content: center;
        }
 
        .nav-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            background: var(--neon-default);
            color: rgba(255,255,255,0.6);
            border: 2px solid transparent;
            transition: box-shadow 0.2s, background 0.2s, color 0.2s, border-color 0.2s, transform 0.15s;
            user-select: none;
        }
        .nav-circle:hover { transform: scale(1.12); }
 
        .nav-circle.current {
            background: #001a10;
            color: var(--neon-current-color);
            border-color: var(--neon-current-color);
            box-shadow: var(--neon-glow-current);
        }
 
        .nav-circle.answered {
            background: #1a0d00;
            color: var(--neon-answered-color);
            border-color: var(--neon-answered-color);
            box-shadow: var(--neon-glow-answered);
        }
 
        .nav-circle.current.answered {
            background: #001a10;
            color: var(--neon-current-color);
            border-color: var(--neon-current-color);
            box-shadow: var(--neon-glow-current);
        }
 
        /* Nav legend */
        .nav-legend {
            display: flex;
            gap: 18px;
            justify-content: center;
            margin-top: 10px;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.55);
        }
        .legend-dot {
            display: inline-block;
            width: 11px; height: 11px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }
 
        /* ── Result Page ── */
        #res-name { text-align: center; font-size: 1.3rem; color: rgba(255,255,255,0.8); margin-bottom: 6px; }
        #score-display {
            text-align: center;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--accent-color);
            text-shadow: 0 0 16px rgba(46,204,113,0.5);
            margin: 10px 0 20px;
        }
 
        #ai-analysis {
            background: rgba(46,204,113,0.1);
            border: 1px solid rgba(46,204,113,0.25);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            line-height: 1.75;
            font-size: 0.93rem;
        }
 
        .review-card {
            background: rgba(0,0,0,0.3);
            padding: 16px;
            margin: 14px 0;
            border-radius: 10px;
            border-left: 5px solid var(--error);
            line-height: 1.65;
            font-size: 0.92rem;
        }
        .review-card.status-correct { border-left-color: var(--correct); }
        .review-card em { color: rgba(255,255,255,0.6); display: block; margin-top: 6px; }
 
        /* ── Timer colour change ── */
        .timer-warning { color: #ff5252 !important; font-weight: 700; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
 
        /* ── Responsive ── */
        @media (max-width: 500px) {
            #exam-container { padding: 1rem; }
            .nav-circle { width: 32px; height: 32px; font-size: 0.75rem; }
            #student-name { width: 95%; }
            .info-box { grid-template-columns: 1fr; gap: 4px; }
        }
    </style>
</head>
<body>
 
<div id="exam-container">
 
    <!-- ══ PAGE 1: LANDING ══ -->
    <div id="page-landing" class="page active">
        <div class="header-main"><h1>Bright Minds Academy</h1></div>
        <div class="hero-card">
            <div class="hero-exam-label">Exam</div>

</div>
 
<script>
    // ══════════════════════════════════════════════
    //  EXAM CONFIGURATION — update per exam
    // ══════════════════════════════════════════════
    const EXAM_KEY        = "10th_Maths_Surds_Practice1";
    const EXAM_NAME       = "Practice Exam - Surds Test 1";
    const HARDCODED_STD   = "10th";
    const HARDCODED_SUBJ  = "Maths practice";
    const WEB_APP_URL     = "https://script.google.com/macros/s/AKfycbwEutZaKIAodDqKVocXPmgGlsfyO6ma8vuQK4sFgEobmvD73QQwztuH4qbT_R3g1Figtw/exec";
    const TOTAL_TIME      = 1800; // 30 minutes in seconds
 
    // ══════════════════════════════════════════════
    //  ✏️  PASTE YOUR JSON QUESTIONS ARRAY BELOW
    //      Format: { q, options[], ans (0-based index), topic, explain }
    // ══════════════════════════════════════════════
    const questions = [
  {
    "q": "Which of the following is a surd?",
    "options": [
      "\\(\\sqrt{4}\\)",
      "\\(\\sqrt{9}\\)",
      "\\(\\sqrt{7}\\)",
      "\\(\\sqrt{25}\\)"
    ],
    "ans": 2,
    "topic": "Identifying Surds",
    "explain": "\\(\\sqrt{7}\\) is irrational and cannot be expressed as a rational number, so it is a surd. \\(\\sqrt{4}=2\\), \\(\\sqrt{9}=3\\), and \\(\\sqrt{25}=5\\) are all rational numbers."
  },
  {
    "q": "Which of the following is <strong>not</strong> a surd?",
    "options": [
      "\\(\\sqrt{3}\\)",
      "\\(\\sqrt[3]{5}\\)",
      "\\(\\sqrt{0.5}\\)",
      "\\(\\sqrt[3]{8}\\)"
    ],
    "ans": 3,
    "topic": "Identifying Surds",
    "explain": "\\(\\sqrt[3]{8} = 2\\), which is a rational number, so it is <strong>not</strong> a surd. The others — \\(\\sqrt{3}\\), \\(\\sqrt[3]{5}\\), and \\(\\sqrt{0.5}\\) — are all irrational."
  },
  {
    "q": "Simplify: \\(\\sqrt{48}\\)",
    "options": [
      "\\(4\\sqrt{3}\\)",
      "\\(3\\sqrt{4}\\)",
      "\\(2\\sqrt{12}\\)",
      "\\(6\\sqrt{2}\\)"
    ],
    "ans": 0,
    "topic": "Simplification of Surds",
    "explain": "\\(\\sqrt{48} = \\sqrt{16 \\times 3} = \\sqrt{16} \\times \\sqrt{3} = 4\\sqrt{3}\\)"
  },
  {
    "q": "Simplify: \\(\\sqrt{72}\\)",
    "options": [
      "\\(8\\sqrt{3}\\)",
      "\\(6\\sqrt{2}\\)",
      "\\(3\\sqrt{8}\\)",
      "\\(4\\sqrt{6}\\)"
    ],
    "ans": 1,
    "topic": "Simplification of Surds",
    "explain": "\\(\\sqrt{72} = \\sqrt{36 \\times 2} = \\sqrt{36} \\times \\sqrt{2} = 6\\sqrt{2}\\)"
  },
  {
    "q": "Simplify: \\(\\sqrt{75} + \\sqrt{27}\\)",
    "options": [
      "\\(7\\sqrt{3}\\)",
      "\\(8\\sqrt{3}\\)",
      "\\(10\\sqrt{3}\\)",
      "\\(6\\sqrt{3}\\)"
    ],
    "ans": 1,
    "topic": "Addition and Subtraction of Surds",
    "explain": "\\(\\sqrt{75} = 5\\sqrt{3}\\) and \\(\\sqrt{27} = 3\\sqrt{3}\\). Adding: \\(5\\sqrt{3} + 3\\sqrt{3} = 8\\sqrt{3}\\)"
  },
  {
    "q": "Simplify: \\(3\\sqrt{12} - \\sqrt{48} + \\sqrt{75}\\)",
    "options": [
      "\\(4\\sqrt{3}\\)",
      "\\(5\\sqrt{3}\\)",
      "\\(6\\sqrt{3}\\)",
      "\\(3\\sqrt{3}\\)"
    ],
    "ans": 1,
    "topic": "Addition and Subtraction of Surds",
    "explain": "\\(3\\sqrt{12} = 6\\sqrt{3}\\), \\(\\sqrt{48} = 4\\sqrt{3}\\), \\(\\sqrt{75} = 5\\sqrt{3}\\). So: \\(6\\sqrt{3} - 4\\sqrt{3} + 5\\sqrt{3} = 7\\sqrt{3}\\). Wait — \\(6-4+5=7\\). Correct answer is \\(7\\sqrt{3}\\). Let me recheck options... \\(6\\sqrt{3} - 4\\sqrt{3} + 5\\sqrt{3} = 7\\sqrt{3}\\).",
    "explain": "\\(3\\sqrt{12} = 3 \\times 2\\sqrt{3} = 6\\sqrt{3}\\), \\(\\sqrt{48} = 4\\sqrt{3}\\), \\(\\sqrt{75} = 5\\sqrt{3}\\). So: \\(6\\sqrt{3} - 4\\sqrt{3} + 5\\sqrt{3} = 7\\sqrt{3}\\)"
  },
  {
    "q": "Multiply: \\(\\sqrt{5} \\times \\sqrt{20}\\)",
    "options": [
      "\\(\\sqrt{25}\\)",
      "\\(5\\)",
      "\\(10\\)",
      "\\(2\\sqrt{5}\\)"
    ],
    "ans": 2,
    "topic": "Multiplication of Surds",
    "explain": "\\(\\sqrt{5} \\times \\sqrt{20} = \\sqrt{5 \\times 20} = \\sqrt{100} = 10\\)"
  },
  {
    "q": "Multiply: \\(2\\sqrt{3} \\times 3\\sqrt{3}\\)",
    "options": [
      "\\(6\\)",
      "\\(12\\)",
      "\\(18\\)",
      "\\(9\\)"
    ],
    "ans": 2,
    "topic": "Multiplication of Surds",
    "explain": "\\(2\\sqrt{3} \\times 3\\sqrt{3} = (2 \\times 3)(\\sqrt{3} \\times \\sqrt{3}) = 6 \\times 3 = 18\\)"
  },
  {
    "q": "Divide: \\(\\dfrac{\\sqrt{98}}{\\sqrt{2}}\\)",
    "options": [
      "\\(7\\)",
      "\\(7\\sqrt{2}\\)",
      "\\(\\sqrt{7}\\)",
      "\\(49\\)"
    ],
    "ans": 0,
    "topic": "Division of Surds",
    "explain": "\\(\\dfrac{\\sqrt{98}}{\\sqrt{2}} = \\sqrt{\\dfrac{98}{2}} = \\sqrt{49} = 7\\)"
  },
  {
    "q": "Rationalise the denominator: \\(\\dfrac{5}{\\sqrt{5}}\\)",
    "options": [
      "\\(\\sqrt{5}\\)",
      "\\(5\\sqrt{5}\\)",
      "\\(\\dfrac{\\sqrt{5}}{5}\\)",
      "\\(25\\)"
    ],
    "ans": 0,
    "topic": "Rationalising the Denominator",
    "explain": "\\(\\dfrac{5}{\\sqrt{5}} = \\dfrac{5 \\times \\sqrt{5}}{\\sqrt{5} \\times \\sqrt{5}} = \\dfrac{5\\sqrt{5}}{5} = \\sqrt{5}\\)"
  },
  {
    "q": "Rationalise the denominator: \\(\\dfrac{1}{\\sqrt{3} + 1}\\)",
    "options": [
      "\\(\\dfrac{\\sqrt{3}+1}{2}\\)",
      "\\(\\dfrac{\\sqrt{3}-1}{2}\\)",
      "\\(\\sqrt{3}-1\\)",
      "\\(\\dfrac{1}{\\sqrt{3}-1}\\)"
    ],
    "ans": 1,
    "topic": "Rationalising the Denominator",
    "explain": "Multiply numerator and denominator by the conjugate \\((\\sqrt{3}-1)\\): \\(\\dfrac{1 \\times (\\sqrt{3}-1)}{(\\sqrt{3}+1)(\\sqrt{3}-1)} = \\dfrac{\\sqrt{3}-1}{3-1} = \\dfrac{\\sqrt{3}-1}{2}\\)"
  },
  {
    "q": "Rationalise the denominator: \\(\\dfrac{6}{2\\sqrt{3} - \\sqrt{6}}\\)",
    "options": [
      "\\(2\\sqrt{3} + \\sqrt{6}\\)",
      "\\(\\sqrt{3} + \\sqrt{6}\\)",
      "\\(2\\sqrt{3} - \\sqrt{6}\\)",
      "\\(\\dfrac{\\sqrt{3}+\\sqrt{6}}{2}\\)"
    ],
    "ans": 0,
    "topic": "Rationalising the Denominator",
    "explain": "Conjugate of \\(2\\sqrt{3}-\\sqrt{6}\\) is \\(2\\sqrt{3}+\\sqrt{6}\\). Denominator becomes \\((2\\sqrt{3})^2 - (\\sqrt{6})^2 = 12 - 6 = 6\\). So: \\(\\dfrac{6(2\\sqrt{3}+\\sqrt{6})}{6} = 2\\sqrt{3}+\\sqrt{6}\\)"
  },
  {
    "q": "Find the value of \\((\\sqrt{5} + \\sqrt{2})^2\\)",
    "options": [
      "\\(7 + 2\\sqrt{10}\\)",
      "\\(7\\)",
      "\\(7 - 2\\sqrt{10}\\)",
      "\\(9 + 2\\sqrt{10}\\)"
    ],
    "ans": 0,
    "topic": "Squaring Surd Expressions",
    "explain": "Using \\((a+b)^2 = a^2 + 2ab + b^2\\): \\((\\sqrt{5})^2 + 2 \\cdot \\sqrt{5} \\cdot \\sqrt{2} + (\\sqrt{2})^2 = 5 + 2\\sqrt{10} + 2 = 7 + 2\\sqrt{10}\\)"
  },
  {
    "q": "Find the value of \\((\\sqrt{7} - \\sqrt{3})^2\\)",
    "options": [
      "\\(10 + 2\\sqrt{21}\\)",
      "\\(4\\)",
      "\\(10 - 2\\sqrt{21}\\)",
      "\\(4 - 2\\sqrt{21}\\)"
    ],
    "ans": 2,
    "topic": "Squaring Surd Expressions",
    "explain": "Using \\((a-b)^2 = a^2 - 2ab + b^2\\): \\((\\sqrt{7})^2 - 2\\sqrt{7}\\cdot\\sqrt{3} + (\\sqrt{3})^2 = 7 - 2\\sqrt{21} + 3 = 10 - 2\\sqrt{21}\\)"
  },
  {
    "q": "Which is greater: \\(\\sqrt{5}\\) or \\(\\sqrt[3]{11}\\)?",
    "options": [
      "\\(\\sqrt{5}\\)",
      "\\(\\sqrt[3]{11}\\)",
      "They are equal",
      "Cannot be compared"
    ],
    "ans": 0,
    "topic": "Comparing Surds",
    "explain": "Convert to the same order (6th root): \\(\\sqrt{5} = 5^{1/2} = 5^{3/6} = \\sqrt[6]{125}\\) and \\(\\sqrt[3]{11} = 11^{1/3} = 11^{2/6} = \\sqrt[6]{121}\\). Since \\(125 > 121\\), \\(\\sqrt{5} > \\sqrt[3]{11}\\)."
  },
  {
    "q": "Simplify: \\(\\dfrac{\\sqrt{3}+1}{\\sqrt{3}-1} + \\dfrac{\\sqrt{3}-1}{\\sqrt{3}+1}\\)",
    "options": [
      "\\(4\\)",
      "\\(6\\)",
      "\\(8\\)",
      "\\(2\\)"
    ],
    "ans": 0,
    "topic": "Rationalising the Denominator",
    "explain": "Rationalise each: \\(\\dfrac{(\\sqrt{3}+1)^2}{2} + \\dfrac{(\\sqrt{3}-1)^2}{2} = \\dfrac{(4+2\\sqrt{3}) + (4-2\\sqrt{3})}{2} = \\dfrac{8}{2} = 4\\)"
  },
  {
    "q": "If \\(x = 3 + 2\\sqrt{2}\\), find \\(x + \\dfrac{1}{x}\\)",
    "options": [
      "\\(6\\)",
      "\\(8\\)",
      "\\(4\\sqrt{2}\\)",
      "\\(3\\)"
    ],
    "ans": 0,
    "topic": "Rationalising the Denominator",
    "explain": "\\(\\dfrac{1}{x} = \\dfrac{1}{3+2\\sqrt{2}} = \\dfrac{3-2\\sqrt{2}}{(3)^2-(2\\sqrt{2})^2} = \\dfrac{3-2\\sqrt{2}}{9-8} = 3-2\\sqrt{2}\\). So \\(x + \\dfrac{1}{x} = (3+2\\sqrt{2}) + (3-2\\sqrt{2}) = 6\\)"
  },
  {
    "q": "Simplify: \\(\\sqrt{5 + 2\\sqrt{6}}\\)",
    "options": [
      "\\(\\sqrt{2} + \\sqrt{3}\\)",
      "\\(\\sqrt{3} - \\sqrt{2}\\)",
      "\\(2 + \\sqrt{3}\\)",
      "\\(\\sqrt{5} + \\sqrt{6}\\)"
    ],
    "ans": 0,
    "topic": "Simplification of Surds",
    "explain": "Note that \\(5 + 2\\sqrt{6} = 3 + 2\\sqrt{6} + 2 = (\\sqrt{3})^2 + 2\\cdot\\sqrt{3}\\cdot\\sqrt{2} + (\\sqrt{2})^2 = (\\sqrt{3}+\\sqrt{2})^2\\). So \\(\\sqrt{5+2\\sqrt{6}} = \\sqrt{3}+\\sqrt{2}\\)"
  },
  {
    "q": "The product \\((\\sqrt{3}+\\sqrt{2})(\\sqrt{3}-\\sqrt{2})\\) equals:",
    "options": [
      "\\(5\\)",
      "\\(1\\)",
      "\\(\\sqrt{6}\\)",
      "\\(2\\sqrt{3}-2\\sqrt{2}\\)"
    ],
    "ans": 1,
    "topic": "Multiplication of Surds",
    "explain": "Using identity \\((a+b)(a-b) = a^2 - b^2\\): \\((\\sqrt{3})^2 - (\\sqrt{2})^2 = 3 - 2 = 1\\)"
  },
  {
    "q": "If \\(\\dfrac{4+\\sqrt{5}}{4-\\sqrt{5}} = a + b\\sqrt{5}\\), find the value of \\(a\\)",
    "options": [
      "\\(\\dfrac{21}{11}\\)",
      "\\(\\dfrac{8}{11}\\)",
      "\\(\\dfrac{11}{21}\\)",
      "\\(\\dfrac{16}{11}\\)"
    ],
    "ans": 0,
    "topic": "Rationalising the Denominator",
    "explain": "Multiply by conjugate: \\(\\dfrac{(4+\\sqrt{5})^2}{(4)^2-(\\sqrt{5})^2} = \\dfrac{16+8\\sqrt{5}+5}{16-5} = \\dfrac{21+8\\sqrt{5}}{11} = \\dfrac{21}{11} + \\dfrac{8}{11}\\sqrt{5}\\). So \\(a = \\dfrac{21}{11}\\)"

    ;
    // ══════════════════════════════════════════════
 
    // ── State ──
    let studentName   = "";
    let userAnswers   = [];
    let currentQ      = 0;
    let timerInterval = null;
    let timeRemaining = TOTAL_TIME;
 
    // ── Start Exam ──
    function startExam() {
        const nameInput = document.getElementById('student-name').value.trim();
        if (!nameInput) { alert("Please enter your name to begin."); return; }
        if (questions.length === 0) { alert("No questions loaded. Please add the JSON data."); return; }
        studentName = nameInput;
        userAnswers = new Array(questions.length).fill(null);
        switchPage('page-exam');
        renderGrid();
        showQuestion();
        startTimer();
    }
 
    // ── Timer ──
    function startTimer() {
        timerInterval = setInterval(() => {
            timeRemaining--;
            updateTimerDisplay();
            sessionStorage.setItem('time_remaining', timeRemaining);
            if (timeRemaining <= 0) { clearInterval(timerInterval); submitExam(); }
        }, 1000);
    }
 
    function updateTimerDisplay() {
        const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        const s = (timeRemaining % 60).toString().padStart(2, '0');
        const el = document.getElementById('timer-display');
        el.textContent = `${m}:${s}`;
        el.className = timeRemaining <= 120 ? 'timer-warning' : '';
    }
 
    // ── Show Question ──
    function showQuestion() {
        const q = questions[currentQ];
        document.getElementById('q-title').textContent = `Question ${currentQ + 1} of ${questions.length}`;
        document.getElementById('q-text').innerHTML = q.q;
 
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        q.options.forEach((opt, i) => {
            const label = document.createElement('label');
            label.className = 'option-label' + (userAnswers[currentQ] === i ? ' selected' : '');
            label.innerHTML = `<input type="radio" name="option" value="${i}" ${userAnswers[currentQ] === i ? 'checked' : ''}> ${opt}`;
            label.addEventListener('click', () => selectAnswer(i));
            container.appendChild(label);
        });
 
        document.getElementById('prev-btn').disabled = currentQ === 0;
        document.getElementById('next-btn').textContent = currentQ === questions.length - 1 ? 'Review' : 'Next ▶';
        updateGrid();
        saveSession();
        if (window.MathJax) MathJax.typesetPromise([document.getElementById('question-scroll-area')]);
    }
 
    // ── Select Answer ──
    function selectAnswer(index) {
        userAnswers[currentQ] = index;
        document.querySelectorAll('.option-label').forEach((el, i) => {
            el.classList.toggle('selected', i === index);
        });
        updateGrid();
        saveSession();
    }
 
    // ── Navigate ──
    function changeQuestion(dir) {
        const next = currentQ + dir;
        if (next >= 0 && next < questions.length) {
            currentQ = next;
            showQuestion();
        }
    }
 
    // ── Neon Navigation Grid ──
    function renderGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = '';
        questions.forEach((_, i) => {
            const circle = document.createElement('div');
            circle.className = 'nav-circle';
            circle.textContent = i + 1;
            circle.id = `nav-${i}`;
            circle.addEventListener('click', () => { currentQ = i; showQuestion(); });
            grid.appendChild(circle);
        });
    }
 
    function updateGrid() {
        questions.forEach((_, i) => {
            const el = document.getElementById(`nav-${i}`);
            if (!el) return;
            el.className = 'nav-circle';
            if (userAnswers[i] !== null) el.classList.add('answered');
            if (i === currentQ) el.classList.add('current');
        });
    }
 
    // ── Submit ──
    function confirmSubmit() {
        const answered = userAnswers.filter(a => a !== null).length;
        const unanswered = questions.length - answered;
        const msg = unanswered > 0
            ? `You have ${unanswered} unanswered question(s). Are you sure you want to submit?`
            : `All questions answered. Submit the exam?`;
        if (confirm(msg)) submitExam();
    }
 
    function submitExam() {
        clearInterval(timerInterval);
 
        let score = 0;
        let missedQuestions = [];
        const topicMap = {};
        let reviewHTML = '';
 
        questions.forEach((q, i) => {
            const correct = userAnswers[i] === q.ans;
            if (correct) score++;
            else missedQuestions.push("Q" + (i + 1));
 
            if (!topicMap[q.topic]) topicMap[q.topic] = { total: 0, correct: 0, failedQ: [] };
            topicMap[q.topic].total++;
            if (correct) topicMap[q.topic].correct++;
            else topicMap[q.topic].failedQ.push(i + 1);
 
            const userAns = userAnswers[i] !== null ? q.options[userAnswers[i]] : '<em>Skipped</em>';
            reviewHTML += `
                <div class="review-card ${correct ? 'status-correct' : ''}">
                    <strong>Q${i + 1}:</strong> ${q.q}<br>
                    <span style="color:${correct ? '#81c784' : '#ff5252'}">Your Answer: ${userAns}</span><br>
                    <span style="color:#81c784">Correct: ${q.options[q.ans]}</span>
                    <em>💡 ${q.explain}</em>
                </div>`;
        });
 
        const scoreStr      = `${score}/${questions.length}`;
        const wrongAnswersStr = missedQuestions.length > 0 ? missedQuestions.join(", ") : "None";
 
        // ── Show Result Page ──
        switchPage('page-result');
        document.getElementById('res-name').textContent   = studentName;
        document.getElementById('score-display').textContent = `Score: ${scoreStr}`;
        document.getElementById('review-list').innerHTML  = reviewHTML;
 
        // ── AI Topic Analysis ──
        let analysis = `<strong>🤖 AI Analysis Feedback (Question-Specific):</strong><br><br>`;
        for (let t in topicMap) {
            const pct = (topicMap[t].correct / topicMap[t].total) * 100;
            if (pct === 100) {
                analysis += `✅ <strong>${t}:</strong> Mastery achieved. Your concepts are perfectly clear.<br>`;
            } else if (pct >= 60) {
                analysis += `🟡 <strong>${t}:</strong> Strong foundation, but minor errors in Question(s) ${topicMap[t].failedQ.join(', ')}. Revise those specific cases.<br>`;
            } else {
                analysis += `🔴 <strong>${t}:</strong> Needs more practice. You missed Question(s) ${topicMap[t].failedQ.join(', ')} — revisit the core rules for this topic.<br>`;
            }
        }
        document.getElementById('ai-analysis').innerHTML = analysis;
        if (window.MathJax) MathJax.typesetPromise([document.getElementById('page-result')]);
 
        // ── Send to Google Sheet ──
        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({
                studentName,
                standard:    HARDCODED_STD,
                examName:    EXAM_NAME,
                subject:     HARDCODED_SUBJ,
                score:       scoreStr,
                wrongAnswers: wrongAnswersStr
            })
        });
 
        // ── Save to localStorage ──
        localStorage.setItem('submitted_data_' + EXAM_KEY,
            JSON.stringify({ name: studentName, answers: userAnswers, score: scoreStr, topicMap }));
        sessionStorage.clear();
        window.scrollTo(0, 0);
    }
 
    // ── Session Save ──
    function saveSession() {
        sessionStorage.setItem('in_progress_' + EXAM_KEY, '1');
        sessionStorage.setItem('name', studentName);
        sessionStorage.setItem('answers', JSON.stringify(userAnswers));
        sessionStorage.setItem('currentQ', currentQ);
        sessionStorage.setItem('time_remaining', timeRemaining);
    }
 
    // ── Utility ──
    function switchPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
 
    // ── On Load ──
    window.onload = () => {
        document.getElementById('exam-title-display').textContent = EXAM_NAME;
 
        const saved = localStorage.getItem('submitted_data_' + EXAM_KEY);
        if (saved) {
            const data = JSON.parse(saved);
            studentName = data.name;
            userAnswers = data.answers;
            showResultsFromStorage(data);
            return;
        }
 
        if (sessionStorage.getItem('in_progress_' + EXAM_KEY)) {
            studentName   = sessionStorage.getItem('name');
            userAnswers   = JSON.parse(sessionStorage.getItem('answers')) || new Array(questions.length).fill(null);
            currentQ      = parseInt(sessionStorage.getItem('currentQ')) || 0;
            timeRemaining = parseInt(sessionStorage.getItem('time_remaining')) || TOTAL_TIME;
            switchPage('page-exam');
            renderGrid();
            showQuestion();
            startTimer();
            updateTimerDisplay();
        }
    };
 
    // ── Show Results from localStorage (already submitted) ──
    function showResultsFromStorage(data) {
        switchPage('page-result');
        document.getElementById('res-name').textContent     = data.name;
        document.getElementById('score-display').textContent = `Score: ${data.score}`;
 
        let reviewHTML = '';
        questions.forEach((q, i) => {
            const correct = userAnswers[i] === q.ans;
            const userAns = userAnswers[i] !== null ? q.options[userAnswers[i]] : '<em>Skipped</em>';
            reviewHTML += `
                <div class="review-card ${correct ? 'status-correct' : ''}">
                    <strong>Q${i + 1}:</strong> ${q.q}<br>
                    <span style="color:${correct ? '#81c784' : '#ff5252'}">Your Answer: ${userAns}</span><br>
                    <span style="color:#81c784">Correct: ${q.options[q.ans]}</span>
                    <em>💡 ${q.explain}</em>
                </div>`;
        });
        document.getElementById('review-list').innerHTML = reviewHTML;
 
        let analysis = `<strong>🤖 AI Analysis Feedback (Question-Specific):</strong><br><br>`;
        for (let t in data.topicMap) {
            const pct = (data.topicMap[t].correct / data.topicMap[t].total) * 100;
            if (pct === 100) {
                analysis += `✅ <strong>${t}:</strong> Mastery achieved. Your concepts are perfectly clear.<br>`;
            } else if (pct >= 60) {
                analysis += `🟡 <strong>${t}:</strong> Strong foundation, but minor errors in Question(s) ${data.topicMap[t].failedQ.join(', ')}. Revise those specific cases.<br>`;
            } else {
                analysis += `🔴 <strong>${t}:</strong> Needs more practice. You missed Question(s) ${data.topicMap[t].failedQ.join(', ')} — revisit the core rules for this topic.<br>`;
            }
        }
        document.getElementById('ai-analysis').innerHTML = analysis;
    }
</script>
