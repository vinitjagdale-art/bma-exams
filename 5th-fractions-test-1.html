<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5th Maths Olympiad - Fractions Test 1</title>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        /* Faint Orange Theme for 5th Maths Olympiad */
        :root { 
            --primary-bg: #4a3521; 
            --text-color: #ffffff; 
            --accent-color: #e67e22; /* Faint Orange */
            --error: #ff5252; 
            --correct: #81c784; 
            --answered: #ff9800; 
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--primary-bg); color: var(--text-color); margin: 0; padding: 10px; display: flex; justify-content: center; }
        #exam-container { width: 100%; max-width: 850px; background: rgba(255, 255, 255, 0.1); padding: 1.5rem; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .page { display: none; }
        .active { display: block; }
        #nav-grid { 
            display: grid; 
            grid-template-columns: repeat(10, 35px); 
            justify-content: center; 
            gap: 12px; 
            margin-top: 20px; 
            background: rgba(0,0,0,0.2); 
            padding: 15px; 
            border-radius: 8px; 
        }
        .nav-box { 
            width: 35px; 
            height: 35px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 50%; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.9rem; 
            transition: all 0.3s ease; 
        }
        .nav-box.current { 
            background: var(--accent-color); 
            border: 2px solid #fff; 
            box-shadow: 0 0 10px var(--accent-color), 0 0 20px var(--accent-color); 
            color: var(--primary-bg); 
        }
        .nav-box.answered { 
            background: var(--answered); 
            border: 2px solid #fff;
            box-shadow: 0 0 8px var(--answered), 0 0 15px var(--answered); 
            color: #fff;
        }
        .info-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; font-size: 0.9rem; }
        .header-main { text-align: center; border-bottom: 2px solid var(--accent-color); margin-bottom: 15px; padding-bottom: 10px; }
        #question-scroll-area { max-height: 60vh; overflow-y: auto; padding-right: 10px; margin-top: 10px; }
        .option-label { display: flex; align-items: center; background: rgba(255,255,255,0.05); margin: 10px 0; padding: 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .option-label:hover { background: rgba(255,255,255,0.12); }
        input[type="radio"] { margin-right: 15px; transform: scale(1.2); }
        .btn-container { margin-top: 20px; display: flex; justify-content: space-between; }
        button { padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; background: var(--accent-color); color: white; font-weight: bold; }
        .review-card { background: rgba(0,0,0,0.3); padding: 15px; margin: 15px 0; border-radius: 8px; border-left: 5px solid var(--error); }
        .review-card.status-correct { border-left-color: var(--correct); }
    </style>
</head>
<body>

<div id="exam-container">
    <div id="page-landing" class="page active">
        <h1 class="header-main">5th Maths Olympiad</h1>
        <div class="info-box" style="display: block;">
            <p><strong>Subject:</strong> Maths</p>
            <p id="exam-title-display"><strong>Topic:</strong> Loading...</p>
            <p><strong>Standard:</strong> 5th | <strong>Marks:</strong> 20 | <strong>Time:</strong> 30 Mins</p>
        </div>
        <div style="margin: 30px 0; text-align: center;">
            <input type="text" id="student-name" placeholder="Enter Full Student Name" style="width: 80%; padding: 12px; border-radius: 6px; border: none;">
        </div>
        <div style="text-align: center;"><button onclick="startExam()">Start Assignment</button></div>
    </div>

    <div id="page-exam" class="page">
        <div class="header-main" style="font-size: 1.2rem;">5th Maths Olympiad</div>
        <div class="info-box">
            <span><strong>Time Left:</strong> <span id="timer-display">30:00</span></span>
            <span><strong>Marks:</strong> 20</span>
            <span><strong>Questions:</strong> 20</span>
        </div>
        <div id="question-scroll-area">
            <h3 id="q-title"></h3>
            <p id="q-text" style="font-size: 1.1rem; line-height: 1.6;"></p>
            <div id="options-container"></div>
        </div>
        <div class="btn-container">
            <button id="prev-btn" onclick="changeQuestion(-1)">Back</button>
            <button id="next-btn" onclick="changeQuestion(1)">Next</button>
        </div>
        <div id="nav-grid"></div>
    </div>

    <div id="page-result" class="page">
        <h2 id="res-name" style="text-align: center;"></h2>
        <h1 style="text-align: center;">Score: <span id="final-score"></span></h1>
        <div id="ai-analysis" style="background: rgba(230, 126, 34, 0.15); padding: 20px; border-radius: 10px; margin: 20px 0; line-height: 1.5;"></div>
        <h3>Question Review</h3>
        <div id="review-list"></div>
    </div>
</div>

<script>
    const EXAM_KEY = "5th_Math_Fractions_Test1_V2"; 
    const EXAM_NAME = "Fractions - Assignment 1"; 
    
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwEutZaKIAodDqKVocXPmgGlsfyO6ma8vuQK4sFgEobmvD73QQwztuH4qbT_R3g1Figtw/exec";
    const HARDCODED_STD = "5th";
    const HARDCODED_SUBJECT = "Maths";
    
    let timerInterval;
    let timeRemaining = 1800; // 30 Minutes

    // 20 Questions formatted with MathJax LaTeX for proper stacked fractions
    const questions = [
        {
            "q": "Two fractions are called like fractions, if they have the same:",
            "options": ["Numerator", "Denominator", "Whole number part", "All of these"],
            "ans": 1,
            "topic": "Like & Unlike Fractions",
            "explain": "Like fractions are fractions that have the exact same denominator (e.g., \\(\\frac{2}{5}\\) and \\(\\frac{3}{5}\\))."
        },
        {
            "q": "\\(\\frac{a}{b}\\) is a fraction. If 'a' is smaller than 'b', \\(\\frac{a}{b}\\) is a:",
            "options": ["Unit fraction", "Proper fraction", "Improper fraction", "Mixed fraction"],
            "ans": 1,
            "topic": "Proper & Improper Fractions",
            "explain": "When the numerator (a) is smaller than the denominator (b), the fraction represents a part less than a whole, making it a proper fraction."
        },
        {
            "q": "Which one of the following statements is NOT correct?",
            "options": ["Value of a proper fraction is less than 1", "Value of an improper fraction is greater than or equal to 1", "Value of equivalent fractions are the same", "Value of a mixed fraction is always less than 1"],
            "ans": 3,
            "topic": "Definitions",
            "explain": "A mixed fraction consists of a whole number and a proper fraction (e.g., \\(2\\frac{1}{2}\\)). Therefore, its value is always greater than 1."
        },
        {
            "q": "Change the fraction \\(\\frac{1255}{8}\\) into a mixed fraction.",
            "options": ["\\(156\\frac{8}{7}\\)", "\\(165\\frac{8}{7}\\)", "\\(156\\frac{7}{8}\\)", "\\(165\\frac{7}{8}\\)"],
            "ans": 2,
            "topic": "Mixed & Improper Fractions",
            "explain": "Divide 1255 by 8. 1255 ÷ 8 = 156 with a remainder of 7. This makes the mixed fraction \\(156\\frac{7}{8}\\)."
        },
        {
            "q": "Jack cuts a paper sheet into 56 equal parts. He colours all the parts with different colours. If the red parts out of the total represent \\(\\frac{13}{28}\\), how many parts did Jack colour red?",
            "options": ["13", "26", "39", "52"],
            "ans": 1,
            "topic": "Equivalent Fractions",
            "explain": "Find the equivalent fraction of \\(\\frac{13}{28}\\) with a denominator of 56. Multiply numerator and denominator by 2: \\(\\frac{13 \\times 2}{28 \\times 2}\\) = \\(\\frac{26}{56}\\). So, 26 parts are red."
        },
        {
            "q": "Convert the mixed fraction \\(154\\frac{5}{9}\\) into an improper fraction.",
            "options": ["\\(\\frac{1931}{9}\\)", "\\(\\frac{1391}{9}\\)", "\\(\\frac{1911}{9}\\)", "\\(\\frac{1191}{9}\\)"],
            "ans": 1,
            "topic": "Mixed & Improper Fractions",
            "explain": "Multiply the whole number by the denominator and add the numerator: (154 × 9) + 5 = 1386 + 5 = 1391. The fraction is \\(\\frac{1391}{9}\\)."
        },
        {
            "q": "Which one of the following is NOT an equivalent fraction of \\(\\frac{3}{5}\\)?",
            "options": ["\\(\\frac{12}{20}\\)", "\\(\\frac{369}{625}\\)", "\\(\\frac{15}{25}\\)", "\\(\\frac{30}{50}\\)"],
            "ans": 1,
            "topic": "Equivalent Fractions",
            "explain": "Let's check \\(\\frac{369}{625}\\). If we divide 625 by 5, we get 125. Multiplying 3 by 125 gives 375, not 369. Thus, \\(\\frac{369}{625}\\) is not equivalent to \\(\\frac{3}{5}\\)."
        },
        {
            "q": "Which of these fractions is considered a unit fraction?",
            "options": ["\\(\\frac{2}{3}\\)", "\\(\\frac{1}{7}\\)", "\\(\\frac{5}{5}\\)", "\\(\\frac{7}{1}\\)"],
            "ans": 1,
            "topic": "Definitions",
            "explain": "A unit fraction is any fraction where the numerator is exactly 1."
        },
        {
            "q": "What is the equivalent fraction of \\(\\frac{2}{5}\\) with a denominator of 20?",
            "options": ["\\(\\frac{4}{20}\\)", "\\(\\frac{8}{20}\\)", "\\(\\frac{10}{20}\\)", "\\(\\frac{14}{20}\\)"],
            "ans": 1,
            "topic": "Equivalent Fractions",
            "explain": "To change the denominator from 5 to 20, multiply by 4. You must also multiply the numerator by 4: 2 × 4 = 8. So, \\(\\frac{8}{20}\\)."
        },
        {
            "q": "Compare \\(\\frac{5}{8}\\) and \\(\\frac{7}{12}\\). Which fraction is greater?",
            "options": ["\\(\\frac{5}{8}\\)", "\\(\\frac{7}{12}\\)", "Both are equal", "Cannot be determined"],
            "ans": 0,
            "topic": "Comparing Fractions",
            "explain": "Find a common denominator (24). \\(\\frac{5}{8}\\) = \\(\\frac{15}{24}\\). \\(\\frac{7}{12}\\) = \\(\\frac{14}{24}\\). Since 15 > 14, \\(\\frac{5}{8}\\) is the greater fraction."
        },
        {
            "q": "Simplify the fraction \\(\\frac{48}{60}\\) to its lowest terms.",
            "options": ["\\(\\frac{4}{5}\\)", "\\(\\frac{8}{10}\\)", "\\(\\frac{12}{15}\\)", "\\(\\frac{24}{30}\\)"],
            "ans": 0,
            "topic": "Simplifying Fractions",
            "explain": "The greatest common divisor (GCD) of 48 and 60 is 12. Divide both numbers by 12 to get \\(\\frac{4}{5}\\)."
        },
        {
            "q": "Add the fractions: \\(\\frac{1}{4} + \\frac{2}{4}\\)",
            "options": ["\\(\\frac{3}{8}\\)", "\\(\\frac{3}{4}\\)", "\\(\\frac{2}{8}\\)", "\\(\\frac{1}{2}\\)"],
            "ans": 1,
            "topic": "Addition of Fractions",
            "explain": "Since the denominators are the same, simply add the numerators: 1 + 2 = 3. The answer is \\(\\frac{3}{4}\\)."
        },
        {
            "q": "Subtract the fractions: \\(\\frac{7}{9} - \\frac{2}{9}\\)",
            "options": ["\\(\\frac{5}{9}\\)", "\\(\\frac{5}{0}\\)", "\\(\\frac{9}{9}\\)", "\\(\\frac{1}{9}\\)"],
            "ans": 0,
            "topic": "Subtraction of Fractions",
            "explain": "Since they are like fractions, subtract the numerators directly: 7 - 2 = 5. Keep the denominator the same: \\(\\frac{5}{9}\\)."
        },
        {
            "q": "Which of the following is an improper fraction?",
            "options": ["\\(\\frac{3}{8}\\)", "\\(\\frac{4}{5}\\)", "\\(\\frac{9}{7}\\)", "\\(\\frac{1}{2}\\)"],
            "ans": 2,
            "topic": "Proper & Improper Fractions",
            "explain": "An improper fraction has a numerator that is equal to or greater than its denominator. 9 is greater than 7."
        },
        {
            "q": "Convert \\(\\frac{23}{6}\\) to a mixed fraction.",
            "options": ["\\(3\\frac{5}{6}\\)", "\\(4\\frac{1}{6}\\)", "\\(3\\frac{1}{6}\\)", "\\(4\\frac{5}{6}\\)"],
            "ans": 0,
            "topic": "Mixed & Improper Fractions",
            "explain": "23 ÷ 6 = 3 with a remainder of 5. The whole number is 3, the remainder is 5, and the denominator stays 6, making it \\(3\\frac{5}{6}\\)."
        },
        {
            "q": "Find the sum: \\(\\frac{1}{2} + \\frac{1}{3}\\)",
            "options": ["\\(\\frac{2}{5}\\)", "\\(\\frac{5}{6}\\)", "\\(\\frac{1}{6}\\)", "\\(\\frac{1}{5}\\)"],
            "ans": 1,
            "topic": "Addition of Fractions",
            "explain": "Find a common denominator (6). \\(\\frac{1}{2}\\) becomes \\(\\frac{3}{6}\\), and \\(\\frac{1}{3}\\) becomes \\(\\frac{2}{6}\\). \\(\\frac{3}{6} + \\frac{2}{6} = \\frac{5}{6}\\)."
        },
        {
            "q": "Express '5 divided by 8' as a fraction.",
            "options": ["\\(\\frac{8}{5}\\)", "\\(\\frac{5}{8}\\)", "\\(1\\frac{3}{5}\\)", "\\(1\\frac{5}{8}\\)"],
            "ans": 1,
            "topic": "Definitions",
            "explain": "Division can be directly written as a fraction where the dividend is the numerator and the divisor is the denominator: \\(\\frac{5}{8}\\)."
        },
        {
            "q": "Which of these fractions is the smallest?",
            "options": ["\\(\\frac{1}{3}\\)", "\\(\\frac{1}{4}\\)", "\\(\\frac{1}{5}\\)", "\\(\\frac{1}{2}\\)"],
            "ans": 2,
            "topic": "Comparing Fractions",
            "explain": "For unit fractions (where the numerator is 1), the fraction with the largest denominator is the smallest in value. Thus, \\(\\frac{1}{5}\\) is the smallest."
        },
        {
            "q": "What is \\(\\frac{3}{4}\\) of 40?",
            "options": ["10", "20", "30", "40"],
            "ans": 2,
            "topic": "Fraction of a Number",
            "explain": "Divide 40 by the denominator (4) to find \\(\\frac{1}{4}\\), which is 10. Then multiply by the numerator (3) to find \\(\\frac{3}{4}\\). 10 × 3 = 30."
        },
        {
            "q": "If a pizza is cut into 8 equal slices and you eat 3, what fraction of the pizza is left?",
            "options": ["\\(\\frac{3}{8}\\)", "\\(\\frac{5}{8}\\)", "\\(\\frac{8}{8}\\)", "\\(\\frac{1}{8}\\)"],
            "ans": 1,
            "topic": "Word Problems",
            "explain": "The whole pizza is \\(\\frac{8}{8}\\). If you eat \\(\\frac{3}{8}\\), subtract that from the whole: \\(\\frac{8}{8} - \\frac{3}{8} = \\frac{5}{8}\\) left over."
        }
    ];

    let currentQ = 0;
    let userAnswers = new Array(20).fill(null);
    let studentName = "";

    function startTimer() {
        timerInterval = setInterval(() => {
            timeRemaining--;
            sessionStorage.setItem('time_remaining', timeRemaining);
            updateTimerDisplay();
            if (timeRemaining <= 0) { 
                clearInterval(timerInterval); 
                submitExam(true); 
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        document.getElementById('timer-display').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function startExam() {
        studentName = document.getElementById('student-name').value.trim();
        if (!studentName) return alert("Please enter your name");
        sessionStorage.setItem('name', studentName);
        sessionStorage.setItem('in_progress_' + EXAM_KEY, "true");
        document.getElementById('page-landing').classList.remove('active');
        document.getElementById('page-exam').classList.add('active');
        document.getElementById('exam-title-display').innerHTML = `<strong>Topic:</strong> ${EXAM_NAME}`;
        startTimer();
        renderGrid();
        showQuestion();
    }

    function renderGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = "";
        questions.forEach((_, i) => {
            const div = document.createElement('div');
            div.className = `nav-box ${i === currentQ ? 'current' : ''} ${userAnswers[i] !== null ? 'answered' : ''}`;
            div.innerText = i + 1;
            div.onclick = () => jumpTo(i);
            grid.appendChild(div);
        });
    }

    function showQuestion() {
        const q = questions[currentQ];
        document.getElementById('q-title').innerText = `Question ${currentQ + 1}`;
        document.getElementById('q-text').innerHTML = q.q;
        const optCont = document.getElementById('options-container');
        optCont.innerHTML = "";
        q.options.forEach((opt, idx) => {
            const lbl = document.createElement('label');
            lbl.className = "option-label";
            // Ensure radio buttons and text are aligned correctly with math elements
            lbl.innerHTML = `<input type="radio" name="opt" ${userAnswers[currentQ] === idx ? 'checked' : ''} onchange="saveAns(${idx})"> <div>${opt}</div>`;
            optCont.appendChild(lbl);
        });
        document.getElementById('next-btn').innerText = currentQ === questions.length - 1 ? "Finish" : "Next";
        sessionStorage.setItem('currentQ', currentQ);
        renderGrid();
        
        // Tells MathJax to render the newly injected LaTeX formulas
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function saveAns(idx) {
        userAnswers[currentQ] = idx;
        sessionStorage.setItem('answers', JSON.stringify(userAnswers));
        renderGrid();
    }

    function jumpTo(i) { currentQ = i; showQuestion(); }

    function changeQuestion(dir) {
        if (dir === 1 && currentQ === questions.length - 1) {
            submitExam(false); 
        } else { 
            currentQ += dir; 
            showQuestion(); 
        }
    }

    async function submitExam(isAutoSubmit = false) {
        if (!isAutoSubmit) {
            const unansweredCount = userAnswers.filter(ans => ans === null).length;
            if (unansweredCount > 0) {
                const confirmSubmit = confirm(`You have left ${unansweredCount} question(s) unanswered. Are you sure you want to finish and submit?`);
                if (!confirmSubmit) return; 
            }
        }

        clearInterval(timerInterval);
        let score = 0;
        let topicMap = {};
        let reviewHTML = "";
        let missedQuestions = [];

        questions.forEach((q, i) => {
            const correct = userAnswers[i] === q.ans;
            if (correct) {
                score++;
            } else {
                missedQuestions.push("Q" + (i + 1));
            }
            if (!topicMap[q.topic]) topicMap[q.topic] = { total: 0, correct: 0, failedQ: [] };
            topicMap[q.topic].total++;
            if (correct) topicMap[q.topic].correct++;
            else topicMap[q.topic].failedQ.push(i + 1);

            reviewHTML += `<div class="review-card ${correct ? 'status-correct' : ''}">
                <strong>Q${i+1}:</strong> ${q.q}<br>
                Your Answer: <span style="color:${correct ? '#81c784' : '#ff5252'}">${userAnswers[i] !== null ? q.options[userAnswers[i]] : 'Skipped'}</span><br>
                Correct: ${q.options[q.ans]}<br>
                <em>Explanation: ${q.explain}</em></div>`;
        });

        const scoreStr = `${score}/${questions.length}`;
        let wrongAnswersString = missedQuestions.length > 0 ? missedQuestions.join(", ") : "None";

        document.getElementById('page-exam').classList.remove('active');
        document.getElementById('page-result').classList.add('active');
        document.getElementById('res-name').innerText = studentName;
        document.getElementById('final-score').innerText = scoreStr;
        document.getElementById('review-list').innerHTML = reviewHTML;

        let analysis = `<strong>AI Analysis Feedback (Question-Specific):</strong><br><br>`;
        for (let t in topicMap) {
            let pct = (topicMap[t].correct / topicMap[t].total) * 100;
            if (pct === 100) {
                analysis += `• Mastery achieved in ${t}. Your concepts are perfectly clear.<br>`;
            } else if (pct >= 60) {
                analysis += `• Strong foundation in ${t}, but minor errors occurred in Question(s) ${topicMap[t].failedQ.join(', ')}.<br>`;
            } else {
                analysis += `• Weak performance in ${t}. For example, in Question(s) ${topicMap[t].failedQ.join(', ')}, you failed to apply the rules correctly.<br>`;
            }
        }
        document.getElementById('ai-analysis').innerHTML = analysis;

        // Render MathJax in the review section
        if (window.MathJax) {
            MathJax.typesetPromise();
        }

        fetch(WEB_APP_URL, { 
            method: "POST", 
            mode: "no-cors", 
            body: JSON.stringify({ 
                studentName, 
                standard: HARDCODED_STD, 
                examName: EXAM_NAME, 
                subject: HARDCODED_SUBJECT,
                score: scoreStr, 
                wrongAnswers: wrongAnswersString 
            }) 
        });
        
        localStorage.setItem('submitted_data_' + EXAM_KEY, JSON.stringify({ name: studentName, answers: userAnswers, score: scoreStr, topicMap }));
        sessionStorage.clear();
        window.scrollTo(0, 0);
    }

    window.onload = () => {
        document.getElementById('exam-title-display').innerHTML = `<strong>Topic:</strong> ${EXAM_NAME}`;
        const saved = localStorage.getItem('submitted_data_' + EXAM_KEY);
        if (saved) {
            const data = JSON.parse(saved);
            studentName = data.name;
            userAnswers = data.answers;
            showResultsFromStorage(data);
        } else if (sessionStorage.getItem('in_progress_' + EXAM_KEY)) {
            studentName = sessionStorage.getItem('name');
            userAnswers = JSON.parse(sessionStorage.getItem('answers')) || userAnswers;
            currentQ = parseInt(sessionStorage.getItem('currentQ')) || 0;
            timeRemaining = parseInt(sessionStorage.getItem('time_remaining')) || 1800;
            document.getElementById('page-landing').classList.remove('active');
            document.getElementById('page-exam').classList.add('active');
            startTimer();
            updateTimerDisplay();
            renderGrid();
            showQuestion();
        }
    };

    function showResultsFromStorage(data) {
        document.getElementById('page-landing').classList.remove('active');
        document.getElementById('page-result').classList.add('active');
        document.getElementById('res-name').innerText = data.name;
        document.getElementById('final-score').innerText = data.score;
        let reviewHTML = "";
        questions.forEach((q, i) => {
            const correct = userAnswers[i] === q.ans;
            reviewHTML += `<div class="review-card ${correct ? 'status-correct' : ''}">
                <strong>Q${i+1}:</strong> ${q.q}<br>
                Your Answer: <span style="color:${correct ? '#81c784' : '#ff5252'}">${userAnswers[i] !== null ? q.options[userAnswers[i]] : 'Skipped'}</span><br>
                Correct: ${q.options[q.ans]}<br>
                <em>Explanation: ${q.explain}</em></div>`;
        });
        document.getElementById('review-list').innerHTML = reviewHTML;
        let analysis = `<strong>AI Analysis Feedback (Question-Specific):</strong><br><br>`;
        for (let t in data.topicMap) {
            let pct = (data.topicMap[t].correct / data.topicMap[t].total) * 100;
            if (pct === 100) {
                analysis += `• Mastery achieved in ${t}. Your concepts are perfectly clear.<br>`;
            } else if (pct >= 60) {
                analysis += `• Strong foundation in ${t}, but minor errors occurred in Question(s) ${data.topicMap[t].failedQ.join(', ')}.<br>`;
            } else {
                analysis += `• Weak performance in ${t}. For example, in Question(s) ${data.topicMap[t].failedQ.join(', ')}, you failed to apply the rules correctly.<br>`;
            }
        }
        document.getElementById('ai-analysis').innerHTML = analysis;
        
        // Render MathJax in the loaded review section
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }
</script>
</body>
</html>
